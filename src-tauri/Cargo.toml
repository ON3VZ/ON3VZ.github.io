[package]
name = "cwld"
description = "CWLD, a modern CW station app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cwld_lib"
path = "src/lib.rs"

[[bin]]
name = "cwld"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
cwld-core = { path = "../crates/cwld-core", features = ["device"] }
cwld-types = { path = "../crates/cwld-types" }
cwld-radio = { path = "../crates/cwld-radio" }
cwld-lookup = { path = "../crates/cwld-lookup" }
serde.workspace = true
serde_json.workspace = true
