<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="'Share Tech Mono','JetBrains Mono',monospace">
  <rect width="980" height="470" rx="10" fill="#0b1220"/>
  <text x="490" y="34" text-anchor="middle" fill="#e8f0f2" font-size="19">What your SWR meter sees... and what it does not</text>

  <defs>
    <marker id="ag" markerWidth="22" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L20,8 L0,16 Z" fill="#00ff9d"/></marker>
    <marker id="ac" markerWidth="18" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L16,7 L0,14 Z" fill="#38e1ff"/></marker>
    <marker id="ar" markerWidth="22" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L20,8 L0,16 Z" fill="#ff5c5c"/></marker>
  </defs>

  <!-- TX -->
  <rect x="50" y="180" width="160" height="90" rx="8" fill="#0e1730" stroke="#1c2a40" stroke-width="2"/>
  <text x="130" y="218" text-anchor="middle" fill="#e8f0f2" font-size="15">Transmitter</text>
  <text x="130" y="242" text-anchor="middle" fill="#38e1ff" font-size="13">+ SWR meter / VNA</text>

  <!-- forward power -->
  <line x1="210" y1="205" x2="430" y2="205" stroke="#00ff9d" stroke-width="8" marker-end="url(#ag)"/>
  <text x="320" y="178" text-anchor="middle" fill="#00ff9d" font-size="14">forward power: 100%</text>

  <!-- reflected -->
  <line x1="430" y1="245" x2="230" y2="245" stroke="#38e1ff" stroke-width="3" marker-end="url(#ac)" stroke-dasharray="7 5"/>
  <text x="320" y="278" text-anchor="middle" fill="#38e1ff" font-size="14">reflected:</text><text x="320" y="298" text-anchor="middle" fill="#38e1ff" font-size="14">the ONLY thing SWR measures</text>

  <!-- unun node -->
  <rect x="440" y="160" width="200" height="130" rx="10" fill="#0e1730" stroke="#00ff9d" stroke-width="2"/>
  <text x="540" y="196" text-anchor="middle" fill="#00ff9d" font-size="15">UNUN + antenna</text>
  <circle cx="540" cy="240" r="26" fill="none" stroke="#5a6b80" stroke-width="10"/>

  <!-- radiated -->
  <line x1="640" y1="190" x2="850" y2="110" stroke="#00ff9d" stroke-width="7" marker-end="url(#ag)"/>
  <text x="790" y="82" text-anchor="middle" fill="#00ff9d" font-size="15">radiated: the part you want</text>
  <path d="M 862 122 q 18 -14 20 -34 M 872 138 q 26 -20 29 -50" fill="none" stroke="#00ff9d" stroke-width="2" opacity="0.6"/>

  <!-- heat -->
  <line x1="640" y1="262" x2="850" y2="330" stroke="#ff5c5c" stroke-width="5" marker-end="url(#ar)"/>
  <text x="800" y="368" text-anchor="middle" fill="#ff5c5c" font-size="15">heat in the ferrite core</text>
  <text x="800" y="388" text-anchor="middle" fill="#ff5c5c" font-size="13">invisible to your SWR meter</text>
  <path d="M 848 300 q 6 -12 0 -22 q -6 -10 0 -20 M 866 306 q 6 -12 0 -22 q -6 -10 0 -20" fill="none" stroke="#ff5c5c" stroke-width="2" opacity="0.7"/>

  <!-- punchline -->
  <rect x="50" y="410" width="880" height="44" rx="8" fill="#0e1730" stroke="#ffbf47" stroke-width="1.5"/>
  <text x="490" y="438" text-anchor="middle" fill="#ffbf47" font-size="15">Power that is absorbed does not reflect. A dummy load has a perfect SWR of 1:1 and radiates nothing.</text>
</svg>
