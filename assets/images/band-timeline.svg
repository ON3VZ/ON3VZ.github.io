  <rect x="412" y="249" width="310" height="52" fill="#3fb950" rx="3" opacity="0.9"/>
  <text x="567" y="279" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="700">DX Intercontinental · NA · Carib. · ZA · JA · VK · AF</text>

  <!-- EU distance 19:00-24:00 -->
  <rect x="722" y="249" width="154" height="52" fill="#56d364" rx="3" opacity="0.55"/>
  <text x="799" y="279" text-anchor="middle" fill="#0d1117" font-size="9">EU dist. (NA→22h)</text>

