  <text x="753" y="403" text-anchor="middle" fill="#6e7681" font-size="9">Closed</text>

  <!-- Legend -->
  <g transform="translate(133,415)">
    <rect x="0" y="0" width="12" height="10" fill="#1f6feb" rx="2"/>
    <text x="16" y="9" fill="#8b949e" font-size="9">DX Intercontinental (&gt;2000 km)</text>
    <rect x="155" y="0" width="12" height="10" fill="#56d364" rx="2"/>
    <text x="171" y="9" fill="#8b949e" font-size="9">EU · Europe (500–2000 km)</text>
    <rect x="300" y="0" width="12" height="10" fill="#388bfd" rx="2" opacity="0.5"/>
    <text x="316" y="9" fill="#8b949e" font-size="9">NVIS · Regional (&lt;500 km)</text>
    <rect x="455" y="0" width="12" height="10" fill="#f0a500" rx="2" opacity="0.85"/>
    <text x="471" y="9" fill="#8b949e" font-size="9">Marginal (cycle-dependent)</text>
    <rect x="608" y="0" width="12" height="10" fill="#30363d" rx="2"/>
    <text x="624" y="9" fill="#8b949e" font-size="9">Closed</text>
    <line x1="680" y1="0" x2="680" y2="10" stroke="#f0a500" stroke-width="1.5" stroke-dasharray="3,2"/>
