  <rect x="412" y="187" width="93" height="52" fill="#f0a500" rx="3" opacity="0.55"/>
  <text x="458" y="217" text-anchor="middle" fill="#0d1117" font-size="9">EU / Trans.</text>

  <!-- DX stable 12:00-24:00 -->
  <rect x="505" y="187" width="371" height="52" fill="#3fb950" rx="3" opacity="0.85"/>
  <text x="691" y="217" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="700">DX World (stable) · NA · PY · JA · ZS · VK</text>

  <!-- ===== 20m row y=248 h=52 ===== -->
  <!-- EU distance 00:00-02:00 -->
  <rect x="133" y="249" width="62" height="52" fill="#56d364" rx="3" opacity="0.55"/>
  <text x="164" y="279" text-anchor="middle" fill="#0d1117" font-size="8">EU</text>

  <!-- Marginal/closed 02:00-07:00 -->
  <rect x="195" y="249" width="155" height="52" fill="#30363d" rx="3" opacity="0.8"/>
  <text x="272" y="279" text-anchor="middle" fill="#8b949e" font-size="9">Marginal / closed</text>

  <!-- Opens 07:00-09:00 -->
  <rect x="350" y="249" width="62" height="52" fill="#56d364" rx="3" opacity="0.6"/>
  <text x="381" y="279" text-anchor="middle" fill="#0d1117" font-size="8">Opening</text>

