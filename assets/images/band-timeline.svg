    <line x1="133" y1="120" x2="876" y2="120"/>
    <line x1="133" y1="182" x2="876" y2="182"/>
    <line x1="133" y1="244" x2="876" y2="244"/>
    <line x1="133" y1="306" x2="876" y2="306"/>
    <line x1="133" y1="368" x2="876" y2="368"/>
  </g>

  <!-- Hour grid verticals -->
  <g stroke="#21262d" stroke-width="0.5">
    <line x1="133" y1="58" x2="133" y2="400"/>
    <line x1="164" y1="58" x2="164" y2="400"/>
    <line x1="195" y1="58" x2="195" y2="400"/>
    <line x1="226" y1="58" x2="226" y2="400"/>
    <line x1="257" y1="58" x2="257" y2="400"/>
    <line x1="288" y1="58" x2="288" y2="400"/>
    <line x1="319" y1="58" x2="319" y2="400"/>
    <line x1="350" y1="58" x2="350" y2="400"/>
    <line x1="381" y1="58" x2="381" y2="400"/>
    <line x1="412" y1="58" x2="412" y2="400"/>
    <line x1="443" y1="58" x2="443" y2="400"/>
    <line x1="474" y1="58" x2="474" y2="400"/>
    <line x1="505" y1="58" x2="505" y2="400"/>
    <line x1="536" y1="58" x2="536" y2="400"/>
    <line x1="567" y1="58" x2="567" y2="400"/>
    <line x1="598" y1="58" x2="598" y2="400"/>
    <line x1="629" y1="58" x2="629" y2="400"/>
    <line x1="660" y1="58" x2="660" y2="400"/>
    <line x1="691" y1="58" x2="691" y2="400"/>
    <line x1="722" y1="58" x2="722" y2="400"/>
    <line x1="753" y1="58" x2="753" y2="400"/>
    <line x1="784" y1="58" x2="784" y2="400"/>
    <line x1="815" y1="58" x2="815" y2="400"/>
    <line x1="846" y1="58" x2="846" y2="400"/>
    <line x1="876" y1="58" x2="876" y2="400"/>
