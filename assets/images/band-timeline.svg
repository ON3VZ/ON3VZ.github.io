    <text x="5" y="88"><tspan font-size="9" fill="#8b949e">3.5 MHz</tspan></text>

    <text x="5" y="158" dominant-baseline="middle">40m</text>
    <text x="5" y="150"><tspan font-size="9" fill="#8b949e">7.0 MHz</tspan></text>

    <text x="5" y="220" dominant-baseline="middle">30m</text>
    <text x="5" y="212"><tspan font-size="9" fill="#8b949e">10.1 MHz</tspan></text>

    <text x="5" y="282" dominant-baseline="middle">20m</text>
    <text x="5" y="274"><tspan font-size="9" fill="#8b949e">14.0 MHz</tspan></text>

    <text x="5" y="344" dominant-baseline="middle">15m</text>
    <text x="5" y="336"><tspan font-size="9" fill="#8b949e">21.0 MHz</tspan></text>

    <text x="5" y="406" dominant-baseline="middle">10m</text>
    <text x="5" y="398"><tspan font-size="9" fill="#8b949e">28.0 MHz</tspan></text>
  </g>

  <!-- ===== 80m row y=62 h=52 ===== -->
  <!-- EU DX 00:00-05:00 (0-5h = px 133 to 288) -->
  <rect x="133" y="63" width="155" height="52" fill="#1f6feb" rx="3" opacity="0.85"/>
  <text x="210" y="93" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600">EU DX · W-EU↔E-EU</text>

  <!-- NVIS 05:00-18:00 (5-18h = 288 to 691) -->
  <rect x="288" y="63" width="403" height="52" fill="#388bfd" rx="3" opacity="0.5"/>
  <text x="489" y="93" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600">NVIS · Regional · Benelux &lt;500 km</text>

  <!-- EU DX 18:00-24:00 (18-24h = 691-876) -->
  <rect x="691" y="63" width="185" height="52" fill="#1f6feb" rx="3" opacity="0.85"/>
  <text x="783" y="93" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600">EU DX · VK/D/F/SP</text>

