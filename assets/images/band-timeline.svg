  <!-- Sunrise/Sunset markers (Belgium ~UTC: sunrise 04:30, sunset 20:00 average) -->
  <line x1="272" y1="58" x2="272" y2="400" stroke="#f0a500" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="753" y1="58" x2="753" y2="400" stroke="#f0a500" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="272" y="56" text-anchor="middle" fill="#f0a500" font-size="9">☀↑</text>
  <text x="753" y="56" text-anchor="middle" fill="#f0a500" font-size="9">☀↓</text>

  <!-- Row labels -->
  <g fill="#e6edf3" font-size="11" font-weight="600">
