  <!-- DX World 00:00-06:00 -->
  <rect x="133" y="125" width="186" height="52" fill="#3fb950" rx="3" opacity="0.85"/>
  <text x="226" y="155" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="700">DX · NA · ZA · JA</text>

  <!-- Europe SW/N 06:00-09:00 -->
  <rect x="319" y="125" width="93" height="52" fill="#56d364" rx="3" opacity="0.6"/>
  <text x="365" y="155" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="600">EU · SW/N</text>

  <!-- NVIS 09:00-16:00 -->
  <rect x="412" y="125" width="217" height="52" fill="#388bfd" rx="3" opacity="0.5"/>
  <text x="520" y="155" text-anchor="middle" fill="#e6edf3" font-size="9" font-weight="600">NVIS · Benelux 800 km</text>

  <!-- Europe N/SW 16:00-18:00 -->
  <rect x="629" y="125" width="62" height="52" fill="#56d364" rx="3" opacity="0.6"/>
  <text x="660" y="155" text-anchor="middle" fill="#0d1117" font-size="8">EU</text>

  <!-- DX World 18:00-24:00 -->
  <rect x="691" y="125" width="185" height="52" fill="#3fb950" rx="3" opacity="0.85"/>
  <text x="783" y="155" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="700">DX · NA · ZA · PY · JA</text>

  <!-- ===== 30m row y=186 h=52 ===== -->
  <!-- DX JA/VK/ZL 00:00-09:00 -->
  <rect x="133" y="187" width="279" height="52" fill="#3fb950" rx="3" opacity="0.85"/>
  <text x="272" y="217" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="700">DX · JA · VK · ZL · NA</text>

