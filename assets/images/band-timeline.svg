<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Segoe UI',Arial,sans-serif">
  <!-- Background -->
  <rect width="900" height="440" fill="#0d1117" rx="10"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700">Band Propagation Timeline — ON3VZ · Belgium JO21EE · All times UTC</text>

  <!-- Column headers (hours) -->
  <g fill="#8b949e" font-size="10" text-anchor="middle">
    <text x="148" y="52">00</text><text x="179" y="52">01</text><text x="210" y="52">02</text>
    <text x="241" y="52">03</text><text x="272" y="52">04</text><text x="303" y="52">05</text>
    <text x="334" y="52">06</text><text x="365" y="52">07</text><text x="396" y="52">08</text>
    <text x="427" y="52">09</text><text x="458" y="52">10</text><text x="489" y="52">11</text>
    <text x="520" y="52">12</text><text x="551" y="52">13</text><text x="582" y="52">14</text>
    <text x="613" y="52">15</text><text x="644" y="52">16</text><text x="675" y="52">17</text>
    <text x="706" y="52">18</text><text x="737" y="52">19</text><text x="768" y="52">20</text>
    <text x="799" y="52">21</text><text x="830" y="52">22</text><text x="861" y="52">23</text>
  </g>

  <!-- Grid lines -->
  <g stroke="#21262d" stroke-width="1">
