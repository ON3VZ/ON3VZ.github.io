  <!-- Closed 00:00-08:00 -->
  <rect x="133" y="311" width="248" height="52" fill="#30363d" rx="3" opacity="0.8"/>
  <text x="257" y="341" text-anchor="middle" fill="#6e7681" font-size="9">Closed</text>

  <!-- Marginal 08:00-09:00 -->
  <rect x="381" y="311" width="31" height="52" fill="#f0a500" rx="3" opacity="0.55"/>
  <text x="396" y="341" text-anchor="middle" fill="#0d1117" font-size="8">~</text>

  <!-- DX F2 09:00-17:00 -->
  <rect x="412" y="311" width="248" height="52" fill="#f0a500" rx="3" opacity="0.85"/>
  <text x="536" y="341" text-anchor="middle" fill="#0d1117" font-size="9" font-weight="700">DX F2 · NA · ZA · JA · VK · PY (SFI&gt;110)</text>

  <!-- Marginal 17:00-18:00 -->
  <rect x="660" y="311" width="31" height="52" fill="#f0a500" rx="3" opacity="0.55"/>
  <text x="675" y="341" text-anchor="middle" fill="#0d1117" font-size="8">~</text>

  <!-- Closed 18:00-24:00 -->
  <rect x="691" y="311" width="185" height="52" fill="#30363d" rx="3" opacity="0.8"/>
  <text x="783" y="341" text-anchor="middle" fill="#6e7681" font-size="9">Closed</text>

  <!-- ===== 10m row y=372 h=52 ===== -->
  <!-- Closed 00:00-09:00 -->
  <rect x="133" y="373" width="279" height="52" fill="#30363d" rx="3" opacity="0.8"/>
  <text x="272" y="403" text-anchor="middle" fill="#6e7681" font-size="9">Closed</text>

  <!-- ~ 09:00-10:00 -->
  <rect x="412" y="373" width="31" height="52" fill="#da3633" rx="3" opacity="0.4"/>
  <text x="427" y="403" text-anchor="middle" fill="#e6edf3" font-size="8">~</text>

  <!-- DX/Es 10:00-15:00 -->
  <rect x="443" y="373" width="155" height="52" fill="#da3633" rx="3" opacity="0.85"/>
  <text x="520" y="403" text-anchor="middle" fill="#fff" font-size="9" font-weight="700">DX / Es · SFI&gt;120 or sporadic-E</text>

  <!-- ~ 15:00-16:00 -->
  <rect x="598" y="373" width="31" height="52" fill="#da3633" rx="3" opacity="0.4"/>
  <text x="613" y="403" text-anchor="middle" fill="#e6edf3" font-size="8">~</text>

