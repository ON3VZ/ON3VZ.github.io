<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;max-width:760px;height:auto;display:block;margin:0 auto;"><title>Signal-to-noise scale in a 2500 hertz bandwidth from minus 26 to plus 14 dB. Left: the minimum needed per mode: FT8 about minus 21 dB, CW by ear about minus 10 dB, SSB about plus 4 dB. FT8 needs about 25 dB less than SSB. Middle: the 16 dB gap between the expedition at 1 kilowatt and my 25 watts. Right: model values for my SSB signals at the expedition: 15 m on a typical day about minus 7 dB and on a good day about 0 dB, 10 m about minus 1 dB typical and about plus 9 dB on a good day.</title><style>.s{font:12px ui-monospace,Menlo,Consolas,monospace;fill:#b9cbdc}.sm{font:11px ui-monospace,Menlo,Consolas,monospace;fill:#8fa6bc}.l{font:600 13px system-ui,sans-serif;fill:#fff}.t{font:600 15px system-ui,sans-serif;fill:#fff}.a{font:600 12.5px system-ui,sans-serif;fill:#ffb23f}.g{font:600 12.5px system-ui,sans-serif;fill:#7ee0a0}.b{font:600 12.5px system-ui,sans-serif;fill:#3fa9f5}.r{font:600 12.5px system-ui,sans-serif;fill:#ff8a7a}.m{font:12px system-ui,sans-serif;fill:#d6e2ee}</style><rect width="760" height="470" rx="14" fill="#0f2236"/><text x="24" y="34" class="t">Signal over noise at the receiver (dB in 2500 Hz)</text><line x1="110" y1="391.8" x2="736" y2="391.8" stroke="#1d3550"/><text x="102" y="395.8" class="sm" text-anchor="end">-25</text><line x1="110" y1="350.5" x2="736" y2="350.5" stroke="#1d3550"/><text x="102" y="354.5" class="sm" text-anchor="end">-20</text><line x1="110" y1="309.2" x2="736" y2="309.2" stroke="#1d3550"/><text x="102" y="313.2" class="sm" text-anchor="end">-15</text><line x1="110" y1="268.0" x2="736" y2="268.0" stroke="#1d3550"/><text x="102" y="272.0" class="sm" text-anchor="end">-10</text><line x1="110" y1="226.8" x2="736" y2="226.8" stroke="#1d3550"/><text x="102" y="230.8" class="sm" text-anchor="end">-5</text><line x1="110" y1="185.5" x2="736" y2="185.5" stroke="#1d3550"/><text x="102" y="189.5" class="sm" text-anchor="end">+0</text><line x1="110" y1="144.2" x2="736" y2="144.2" stroke="#1d3550"/><text x="102" y="148.2" class="sm" text-anchor="end">+5</text><line x1="110" y1="103.0" x2="736" y2="103.0" stroke="#1d3550"/><text x="102" y="107.0" class="sm" text-anchor="end">+10</text><line x1="110" y1="185.5" x2="736" y2="185.5" stroke="#5d7a96"/><text x="136" y="179.5" class="sm">signal = noise</text><text x="130" y="60" class="l">What each mode needs</text><rect x="130" y="358.8" width="200" height="41.2" fill="#7ee0a0" opacity=".14"/><line x1="130" y1="358.8" x2="330" y2="358.8" stroke="#7ee0a0" stroke-width="3"/><text x="136" y="352.8" class="l" style="fill:#7ee0a0">FT8  -21 dB</text><rect x="130" y="268.0" width="200" height="132.0" fill="#3fa9f5" opacity=".14"/><line x1="130" y1="268.0" x2="330" y2="268.0" stroke="#3fa9f5" stroke-width="3"/><text x="136" y="262.0" class="l" style="fill:#3fa9f5">CW by ear  about -10 dB</text><rect x="130" y="152.5" width="200" height="247.5" fill="#ff8a7a" opacity=".14"/><line x1="130" y1="152.5" x2="330" y2="152.5" stroke="#ff8a7a" stroke-width="3"/><text x="136" y="146.5" class="l" style="fill:#ff8a7a">SSB  about +4 dB</text><path d="M345,152.5 v206.2" stroke="#ffb23f" stroke-width="2" marker-end="url(#ar)"/><defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#ffb23f"/></marker></defs><text x="352" y="243.2" class="a">25 dB</text><text x="352" y="258.2" class="sm">about 300x</text><text x="352" y="273.2" class="sm">the power</text><text x="440" y="60" class="l">1 kW vs 25 W</text><rect x="450" y="103.0" width="40" height="132.0" rx="3" fill="#ffb23f" opacity=".8"/><text x="470" y="253.0" class="a" text-anchor="middle">16 dB</text><text x="470" y="267.0" class="sm" text-anchor="middle">= 40x</text><text x="470" y="283.0" class="sm" text-anchor="middle">about</text><text x="470" y="297.0" class="sm" text-anchor="middle">3 S-units</text><text x="560" y="60" class="l">My SSB at 3X4U (model)</text><line x1="585" y1="244.9" x2="585" y2="186.3" stroke="#8fa6bc" stroke-width="2" stroke-dasharray="4 3"/><circle cx="585" cy="244.9" r="7" fill="#8fa6bc"/><circle cx="585" cy="186.3" r="7" fill="#7ee0a0"/><text x="596" y="248.9" class="sm">typical</text><text x="596" y="190.3" class="g">good day</text><text x="585" y="418.0" class="l" text-anchor="middle">15 m</text><line x1="675" y1="197.1" x2="675" y2="109.6" stroke="#8fa6bc" stroke-width="2" stroke-dasharray="4 3"/><circle cx="675" cy="197.1" r="7" fill="#8fa6bc"/><circle cx="675" cy="109.6" r="7" fill="#7ee0a0"/><text x="686" y="201.1" class="sm">typical</text><text x="686" y="113.6" class="g">good day</text><text x="675" y="418.0" class="l" text-anchor="middle">10 m</text><text x="24" y="454" class="sm">Mode limits as used in my VOACAP runs. Typical: monthly median. Good day: best 10% of days.</text></svg>