<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;max-width:760px;height:auto;display:block;margin:0 auto;"><title>Bar chart of the share of the Hoboken to Lac de Koba path in daylight per UTC hour on 18 November 2026. From 00 to 06 UTC the whole path is dark. At 07 UTC almost half is lit and from 08 to 15 UTC the whole path is in daylight. Between 16 and 18 UTC the night moves in from the north, and from 19 UTC the path is dark again. Markers show the QSOs: 40 m FT8 at 23:25, 10 m SSB at 10:48, 15 m SSB at 13:46, 10 m CW at 14:14 and 15 m FT8 at 17:07.</title><style>.s{font:12px ui-monospace,Menlo,Consolas,monospace;fill:#b9cbdc}.sm{font:11px ui-monospace,Menlo,Consolas,monospace;fill:#8fa6bc}.l{font:600 13px system-ui,sans-serif;fill:#fff}.t{font:600 15px system-ui,sans-serif;fill:#fff}.a{font:600 12.5px system-ui,sans-serif;fill:#ffb23f}.g{font:600 12.5px system-ui,sans-serif;fill:#7ee0a0}.b{font:600 12.5px system-ui,sans-serif;fill:#3fa9f5}.r{font:600 12.5px system-ui,sans-serif;fill:#ff8a7a}.m{font:12px system-ui,sans-serif;fill:#d6e2ee}</style><rect width="760" height="430" rx="14" fill="#0f2236"/><text x="24" y="34" class="t">How much of the path is in daylight? (18 November, UTC)</text><line x1="60" y1="316" x2="720" y2="316" stroke="#1d3550"/><text x="52" y="320" class="sm" text-anchor="end">0%</text><line x1="60" y1="206" x2="720" y2="206" stroke="#1d3550"/><text x="52" y="210" class="sm" text-anchor="end">50%</text><line x1="60" y1="96" x2="720" y2="96" stroke="#1d3550"/><text x="52" y="100" class="sm" text-anchor="end">100%</text><rect x="62.0" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><text x="73.8" y="332" class="sm" text-anchor="middle">00</text><rect x="89.5" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><rect x="117.0" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><rect x="144.5" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><text x="156.2" y="332" class="sm" text-anchor="middle">03</text><rect x="172.0" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><rect x="199.5" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><rect x="227.0" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><text x="238.8" y="332" class="sm" text-anchor="middle">06</text><rect x="254.5" y="96.0" width="23.5" height="220.0" rx="2" fill="#ffb23f"/><rect x="282.0" y="96.0" width="23.5" height="220.0" rx="2" fill="#ffb23f"/><rect x="309.5" y="96.0" width="23.5" height="220.0" rx="2" fill="#ffb23f"/><text x="321.2" y="332" class="sm" text-anchor="middle">09</text><rect x="337.0" y="96.0" width="23.5" height="220.0" rx="2" fill="#ffb23f"/><rect x="364.5" y="96.0" width="23.5" height="220.0" rx="2" fill="#ffb23f"/><rect x="392.0" y="96.0" width="23.5" height="220.0" rx="2" fill="#ffb23f"/><text x="403.8" y="332" class="sm" text-anchor="middle">12</text><rect x="419.5" y="96.0" width="23.5" height="220.0" rx="2" fill="#ffb23f"/><rect x="447.0" y="96.0" width="23.5" height="220.0" rx="2" fill="#ffb23f"/><rect x="474.5" y="96.0" width="23.5" height="220.0" rx="2" fill="#ffb23f"/><text x="486.2" y="332" class="sm" text-anchor="middle">15</text><rect x="502.0" y="137.6" width="23.5" height="178.4" rx="2" fill="#3fa9f5"/><rect x="529.5" y="215.3" width="23.5" height="100.7" rx="2" fill="#3fa9f5"/><rect x="557.0" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><text x="568.8" y="332" class="sm" text-anchor="middle">18</text><rect x="584.5" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><rect x="612.0" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><rect x="639.5" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><text x="651.2" y="332" class="sm" text-anchor="middle">21</text><rect x="667.0" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><rect x="694.5" y="314.0" width="23.5" height="2.0" rx="2" fill="#22384f"/><line x1="251.1" y1="72" x2="251.1" y2="316" stroke="#5d7a96" stroke-dasharray="3 3"/><text x="247.1" y="68" class="g" text-anchor="end">sunrise at both ends 06:52 to 07:05</text><line x1="495.9" y1="72" x2="495.9" y2="316" stroke="#5d7a96" stroke-dasharray="3 3"/><text x="499.9" y="68" class="b" text-anchor="start">sunset Hoboken 15:51</text><line x1="569.3" y1="90" x2="569.3" y2="316" stroke="#5d7a96" stroke-dasharray="3 3"/><text x="573.3" y="86" class="b" text-anchor="start">sunset Koba 18:31</text><path d="M704.0,338 l-5,9 h10z" fill="#7ee0a0"/><text x="704.0" y="358" class="sm" text-anchor="middle" style="fill:#7ee0a0">40m FT8</text><path d="M357.0,338 l-5,9 h10z" fill="#ff8a7a"/><text x="357.0" y="358" class="sm" text-anchor="middle" style="fill:#ff8a7a">10m SSB*</text><path d="M438.6,338 l-5,9 h10z" fill="#ff8a7a"/><text x="438.6" y="374" class="sm" text-anchor="middle" style="fill:#ff8a7a">15m SSB</text><path d="M451.4,338 l-5,9 h10z" fill="#3fa9f5"/><text x="451.4" y="390" class="sm" text-anchor="middle" style="fill:#3fa9f5">10m CW</text><path d="M530.7,338 l-5,9 h10z" fill="#7ee0a0"/><text x="530.7" y="358" class="sm" text-anchor="middle" style="fill:#7ee0a0">15m FT8</text><text x="24" y="416" class="sm">Amber: whole path lit. Blue: partly lit. * 10 m SSB was on 19 November, same daylight pattern.</text></svg>