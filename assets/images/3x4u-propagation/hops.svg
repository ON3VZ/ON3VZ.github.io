<svg viewBox="0 0 760 445" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;max-width:760px;height:auto;display:block;margin:0 auto;"><title>Side view of the path from Hoboken to Lac de Koba. The signal leaves the vertical at a low angle, is bent back by the F2 layer about 300 km up, bounces once off the ground in southern Morocco and is bent down again to Guinea. In daytime a D layer below the F2 layer absorbs part of the signal on every pass, more on the lower bands. At the Guinea end lightning noise from tropical thunderstorms adds to the noise; at the Belgian end there is city noise.</title><style>.s{font:12px ui-monospace,Menlo,Consolas,monospace;fill:#b9cbdc}.sm{font:11px ui-monospace,Menlo,Consolas,monospace;fill:#8fa6bc}.l{font:600 13px system-ui,sans-serif;fill:#fff}.t{font:600 15px system-ui,sans-serif;fill:#fff}.a{font:600 12.5px system-ui,sans-serif;fill:#ffb23f}.g{font:600 12.5px system-ui,sans-serif;fill:#7ee0a0}.b{font:600 12.5px system-ui,sans-serif;fill:#3fa9f5}.r{font:600 12.5px system-ui,sans-serif;fill:#ff8a7a}.m{font:12px system-ui,sans-serif;fill:#d6e2ee}</style><rect width="760" height="445" rx="14" fill="#0f2236"/><text x="24" y="34" class="t">Two hops to Guinea (daytime, simplified, heights not to scale)</text><path d="M8.8,250.7 L17.9,248.7 L27.1,246.7 L36.3,244.8 L45.4,243.0 L54.6,241.2 L63.8,239.4 L73.0,237.7 L82.2,236.1 L91.4,234.5 L100.6,232.9 L109.9,231.4 L119.1,230.0 L128.4,228.6 L137.6,227.2 L146.9,225.9 L156.1,224.7 L165.4,223.5 L174.7,222.3 L184.0,221.2 L193.3,220.2 L202.6,219.2 L211.9,218.3 L221.2,217.4 L230.5,216.5 L239.8,215.7 L249.2,215.0 L258.5,214.3 L267.8,213.7 L277.2,213.1 L286.5,212.6 L295.8,212.1 L305.2,211.6 L314.5,211.2 L323.9,210.9 L333.2,210.6 L342.6,210.4 L351.9,210.2 L361.3,210.1 L370.6,210.0 L380.0,210.0 L389.4,210.0 L398.7,210.1 L408.1,210.2 L417.4,210.4 L426.8,210.6 L436.1,210.9 L445.5,211.2 L454.8,211.6 L464.2,212.1 L473.5,212.6 L482.8,213.1 L492.2,213.7 L501.5,214.3 L510.8,215.0 L520.2,215.7 L529