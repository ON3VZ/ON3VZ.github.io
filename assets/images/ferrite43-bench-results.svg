<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Share Tech Mono','JetBrains Mono',monospace">
  <rect width="980" height="560" rx="10" fill="#0b1220"/>
  <text x="490" y="32" text-anchor="middle" fill="#e8f0f2" font-size="19">ON4BB's bench test: SWR of the 49:1 UNUN on a 2500 &#937; dummy feedpoint</text>

  <!-- setup chain -->
  <rect x="60" y="56" width="170" height="44" rx="7" fill="#0e1730" stroke="#1c2a40" stroke-width="2"/>
  <text x="145" y="83" text-anchor="middle" fill="#e8f0f2" font-size="13">DG8SAQ VNWA</text>
  <line x1="230" y1="78" x2="300" y2="78" stroke="#38e1ff" stroke-width="3"/>
  <rect x="300" y="56" width="120" height="44" rx="7" fill="#0e1730" stroke="#1c2a40" stroke-width="2"/>
  <text x="360" y="83" text-anchor="middle" fill="#e8f0f2" font-size="13">SMA input</text>
  <line x1="420" y1="78" x2="490" y2="78" stroke="#38e1ff" stroke-width="3"/>
  <rect x="490" y="56" width="220" height="44" rx="7" fill="#0e1730" stroke="#00ff9d" stroke-width="2"/>
  <text x="600" y="83" text-anchor="middle" fill="#00ff9d" font-size="13">49:1 UNUN on FT240-43</text>
  <line x1="710" y1="78" x2="780" y2="78" stroke="#38e1ff" stroke-width="3"/>
  <rect x="780" y="56" width="150" height="44" rx="7" fill="#0e1730" stroke="#ffbf47" stroke-width="2"/>
  <text x="855" y="75" text-anchor="middle" fill="#ffbf47" font-size="12">&#8776;2500 &#937; metal film</text>
  <text x="855" y="92" text-anchor="middle" fill="#8fa3b8" font-size="11">= fake EFHW feedpoint</text>

  <!-- plot area -->
  <rect x="90" y="140" width="860" height="300" fill="#0e1730"/>
  <line x1="90" y1="440" x2="950" y2="440" stroke="#1c2a40" stroke-width="1.5"/>
  <line x1="90" y1="315" x2="950" y2="315" stroke="#1c2a40" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="90" y1="190" x2="950" y2="190" stroke="#ff5c5c" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="86" y="445" text-anchor="end" fill="#8fa3b8" font-size="13">1.0</text>
  <text x="86" y="320" text-anchor="end" fill="#8fa3b8" font-size="13">1.5</text>
  <text x="86" y="195" text-anchor="end" fill="#8fa3b8" font-size="13">2.0</text>
  <text x="945" y="182" text-anchor="end" fill="#ff5c5c" font-size="13">SWR 2:1 comfort limit</text>
  <text x="40" y="290" fill="#8fa3b8" font-size="14" transform="rotate(-90 40 290)" text-anchor="middle">VSWR</text>

  <!-- bars: v -> y = 440 - (v-1)/1.2*300 -->
  <rect x="120" y="250" width="80" height="190" fill="#00ff9d" opacity="0.85"/>
  <rect x="260" y="365" width="80" height="75"  fill="#00ff9d" opacity="0.85"/>
  <rect x="400" y="395" width="80" height="45"  fill="#00ff9d" opacity="0.85"/>
  <rect x="540" y="392" width="80" height="48"  fill="#00ff9d" opacity="0.85"/>
  <rect x="680" y="380" width="80" height="60"  fill="#00ff9d" opacity="0.85"/>
  <rect x="820" y="295" width="80" height="145" fill="#00ff9d" opacity="0.85"/>

  <text x="160" y="238" text-anchor="middle" fill="#e8f0f2" font-size="15">1.76</text>
  <text x="300" y="353" text-anchor="middle" fill="#e8f0f2" font-size="15">1.30</text>
  <text x="440" y="383" text-anchor="middle" fill="#e8f0f2" font-size="15">1.18</text>
  <text x="580" y="380" text-anchor="middle" fill="#e8f0f2" font-size="15">1.19</text>
  <text x="720" y="368" text-anchor="middle" fill="#e8f0f2" font-size="15">1.24</text>
  <text x="860" y="283" text-anchor="middle" fill="#e8f0f2" font-size="15">1.58</text>

  <text x="160" y="466" text-anchor="middle" fill="#ffbf47" font-size="14">80 m</text>
  <text x="300" y="466" text-anchor="middle" fill="#ffbf47" font-size="14">40 m</text>
  <text x="440" y="466" text-anchor="middle" fill="#ffbf47" font-size="14">20 m</text>
  <text x="580" y="466" text-anchor="middle" fill="#ffbf47" font-size="14">17 m</text>
  <text x="720" y="466" text-anchor="middle" fill="#ffbf47" font-size="14">15 m</text>
  <text x="860" y="466" text-anchor="middle" fill="#ffbf47" font-size="14">10 m</text>

  <text x="160" y="486" text-anchor="middle" fill="#8fa3b8" font-size="12">3.58 MHz</text>
  <text x="300" y="486" text-anchor="middle" fill="#8fa3b8" font-size="12">7.06 MHz</text>
  <text x="440" y="486" text-anchor="middle" fill="#8fa3b8" font-size="12">14.30 MHz</text>
  <text x="580" y="486" text-anchor="middle" fill="#8fa3b8" font-size="12">18.11 MHz</text>
  <text x="720" y="486" text-anchor="middle" fill="#8fa3b8" font-size="12">21.13 MHz</text>
  <text x="860" y="486" text-anchor="middle" fill="#8fa3b8" font-size="12">28.80 MHz</text>

  <text x="160" y="508" text-anchor="middle" fill="#38e1ff" font-size="12">|Z| 40 &#937;</text>
  <text x="300" y="508" text-anchor="middle" fill="#38e1ff" font-size="12">|Z| 44 &#937;</text>
  <text x="440" y="508" text-anchor="middle" fill="#38e1ff" font-size="12">|Z| 43 &#937;</text>
  <text x="580" y="508" text-anchor="middle" fill="#38e1ff" font-size="12">|Z| 43 &#937;</text>
  <text x="720" y="508" text-anchor="middle" fill="#38e1ff" font-size="12">|Z| 48 &#937;</text>
  <text x="860" y="508" text-anchor="middle" fill="#38e1ff" font-size="12">|Z| 79 &#937;</text>

  <text x="490" y="540" text-anchor="middle" fill="#8fa3b8" font-size="13">sweep 3 to 28.8 MHz, &#8776;2000 points &#183; every band comfortably under SWR 2:1 &#183; looks perfect... right?</text>
</svg>
