<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="'Share Tech Mono','JetBrains Mono',monospace">
<!-- CHINA-10M 2026-11-06: schematic cross-section. Remove together with the post to revert. -->
<defs><linearGradient id="sky" x1="0" x2="1"><stop offset="0.000" stop-color="#1c4a86"/><stop offset="0.167" stop-color="#1c4a86"/><stop offset="0.333" stop-color="#1c4a86"/><stop offset="0.500" stop-color="#1c4a86"/><stop offset="0.667" stop-color="#27396b"/><stop offset="0.833" stop-color="#27396b"/><stop offset="1.000" stop-color="#171d3e"/></linearGradient>
<linearGradient id="dl" x1="0" x2="1"><stop offset="0.000" stop-color="#ff4466" stop-opacity="0.41"/><stop offset="0.167" stop-color="#ff4466" stop-opacity="0.37"/><stop offset="0.333" stop-color="#ff4466" stop-opacity="0.31"/><stop offset="0.500" stop-color="#ff4466" stop-opacity="0.24"/><stop offset="0.667" stop-color="#ff4466" stop-opacity="0.15"/><stop offset="0.833" stop-color="#ff4466" stop-opacity="0.02"/><stop offset="1.000" stop-color="#ff4466" stop-opacity="0.00"/></linearGradient>
<filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="980" height="620" rx="10" fill="#080d18"/>
<text x="490" y="34" text-anchor="middle" fill="#e2eaf5" font-size="19">Three F2 hops, and the D layer fading out along the way</text>
<text x="490" y="56" text-anchor="middle" fill="#7a96b0" font-size="12">Schematic side view of the path at 10:00 UTC. Heights greatly exaggerated, hop lengths about 2,927 km.</text>
<clipPath id="pc"><rect x="30" y="74" width="920" height="416" rx="8"/></clipPath>
<g clip-path="url(#pc)">
<rect x="30" y="74" width="920" height="416" fill="url(#sky)"/>
<rect x="30" y="120" width="920" height="46" fill="#00d4ff" fill-opacity="0.13"/>
<line x1="30" y1="143" x2="950" y2="143" stroke="#00d4ff" stroke-opacity="0.45" stroke-dasharray="3 5"/>
<rect x="30" y="318" width="920" height="40" fill="url(#dl)"/>
<rect x="30" y="430" width="920" height="60" fill="#14241a"/>
<line x1="30" y1="430" x2="950" y2="430" stroke="#00ff88" stroke-opacity="0.6" stroke-width="1.5"/>
<path d="M80.0,430 Q216.7,-144 353.3,430" fill="none" stroke="#00ff88" stroke-width="3" filter="url(#glow)"/>
<path d="M353.3,430 Q490.0,-144 626.7,430" fill="none" stroke="#00ff88" stroke-width="3" filter="url(#glow)"/>
<path d="M626.7,430 Q763.3,-144 900.0,430" fill="none" stroke="#00ff88" stroke-width="3" filter="url(#glow)"/>
<line x1="763.3" y1="84" x2="763.3" y2="430" stroke="#f0a500" stroke-width="1.6" stroke-dasharray="7 5"/>
</g>
<text x="44" y="138" fill="#00d4ff" font-size="12">F2 layer, about 250 to 350 km</text>
<text x="44" y="154" fill="#7a96b0" font-size="11">bends 10 m back to earth, if its MUF is above 28.5 MHz</text>
<rect x="36" y="322" width="330" height="36" rx="5" fill="#080d18" fill-opacity="0.7"/>
<text x="44" y="337" fill="#ff9fb0" font-size="12">D layer, about 60 to 90 km</text>
<text x="44" y="352" fill="#ff9fb0" fill-opacity="0.9" font-size="11">soaks up signal, but only while the sun shines</text>
<circle cx="80.0" cy="430" r="7" fill="#ff4466" stroke="#fff" stroke-width="1.5"/>
<circle cx="900.0" cy="430" r="7" fill="#ff4466" stroke="#fff" stroke-width="1.5"/>
<line x1="80.0" y1="424" x2="80.0" y2="396" stroke="#fff" stroke-width="2"/>
<text x="80.0" y="452" text-anchor="middle" fill="#e2eaf5" font-size="14">ON3VZ</text>
<text x="80.0" y="468" text-anchor="middle" fill="#7a96b0" font-size="11">IronWave 6, 25 W</text>
<text x="900.0" y="452" text-anchor="middle" fill="#e2eaf5" font-size="14">BH7FFR</text>
<text x="900.0" y="468" text-anchor="middle" fill="#7a96b0" font-size="11">Changsha</text>
<text x="30" y="500" fill="#7a96b0" font-size="11">Sun above the horizon at 10:00 UTC:</text>
<text x="80.0" y="522" text-anchor="middle" fill="#f0a500" font-size="15">+20°</text>
<text x="216.7" y="522" text-anchor="middle" fill="#f0a500" font-size="15">+18°</text>
<text x="353.3" y="522" text-anchor="middle" fill="#f0a500" font-size="15">+14°</text>
<text x="490.0" y="522" text-anchor="middle" fill="#f0a500" font-size="15">+10°</text>
<text x="490.0" y="540" text-anchor="middle" fill="#7a96b0" font-size="10">sunset 11:27</text>
<text x="626.7" y="522" text-anchor="middle" fill="#ff8a3d" font-size="15">+5°</text>
<text x="763.3" y="522" text-anchor="middle" fill="#ff8a3d" font-size="15">+0°</text>
<text x="763.3" y="540" text-anchor="middle" fill="#7a96b0" font-size="10">sunset 10:03</text>
<text x="900.0" y="522" text-anchor="middle" fill="#8aa3c4" font-size="15">-5°</text>
<text x="900.0" y="540" text-anchor="middle" fill="#7a96b0" font-size="10">sunset 09:40</text>
<circle cx="130" cy="250" r="12" fill="#080d18" stroke="#00ff88" stroke-width="1.8"/><text x="130" y="254.5" text-anchor="middle" fill="#00ff88" font-size="13">1</text>
<circle cx="490.0" cy="280" r="12" fill="#080d18" stroke="#00ff88" stroke-width="1.8"/><text x="490.0" y="284.5" text-anchor="middle" fill="#00ff88" font-size="13">2</text>
<circle cx="823.3333333333334" cy="250" r="12" fill="#080d18" stroke="#00ff88" stroke-width="1.8"/><text x="823.3333333333334" y="254.5" text-anchor="middle" fill="#00ff88" font-size="13">3</text>
<text x="767.3" y="98" fill="#f0a500" font-size="12">sunset line</text>
<text x="216.7" y="426" text-anchor="middle" fill="#7a96b0" font-size="10"> </text>
<text x="30" y="572" fill="#7a96b0" font-size="11">1  Europe: full daylight, but the MUF is far above 28.5 MHz, so no problem</text>
<text x="30" y="589" fill="#7a96b0" font-size="11">2  Middle of the path: sun already low, so the D layer absorbs much less</text>
<text x="30" y="606" fill="#7a96b0" font-size="11">3  China: sunset passed, D layer gone, F2 layer still alive, almost no loss</text>
</svg>