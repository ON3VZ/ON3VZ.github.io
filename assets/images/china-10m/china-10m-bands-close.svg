<text x="30" y="478" fill="#7a96b0" font-size="11">As the evening deepens, the highest usable frequency slides down. Where it crosses a band, that band closes.</text>
<text x="30" y="496" fill="#7a96b0" font-size="11">10 m is the first to go (at the top). 15 m sits lower, so it stays open longer.</text>
<text x="30" y="514" fill="#7a96b0" font-size="11">Both dots must lie below the curve, because both contacts happened. The exact shape and timing of the curve are not measured.</text>
