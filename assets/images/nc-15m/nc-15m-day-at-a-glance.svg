<text x="30" y="378" fill="#7a96b0" font-size="11">Morning: China is at dusk, Europe in full daylight. The far end of the path is the one that matters.</text>
<text x="30" y="396" fill="#7a96b0" font-size="11">Afternoon: Hoboken is at sunset and North Carolina is in the morning. Now it is my own end that is at dusk.</text>
<text x="30" y="414" fill="#7a96b0" font-size="11">Same sun, same antenna family, two different tricks. Sunset times are calculated for the middle of each town.</text>
