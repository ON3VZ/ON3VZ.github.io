<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" style="width:100%;max-width:760px;height:auto;display:block;margin:0 auto;"><title>FT8 margin meter: FT8 decodes down to about minus 21 dB. My signal arrived at minus 10 dB, 11 dB above the limit. On paper about 2 W would still have decoded.</title><style>.s{font:12px ui-monospace,Menlo,Consolas,monospace;fill:#b9cbdc}.l{font:600 13px system-ui,sans-serif;fill:#fff}.a{font:600 12.5px system-ui,sans-serif;fill:#ffb23f}.g{font:600 12.5px system-ui,sans-serif;fill:#7ee0a0}.r{font:600 12.5px system-ui,sans-serif;fill:#ff8a7a}.m{font:12px system-ui,sans-serif;fill:#d6e2ee}</style><rect width="760" height="300" rx="14" fill="#0f2236"/><rect x="50" y="136" width="106" height="28" fill="#ff5b4a" opacity=".55"/><rect x="156" y="136" width="574" height="28" fill="#3fa9f5" opacity=".35"/><line x1="50.0" y1="164" x2="50.0" y2="170" stroke="#9fb6cc"/><text x="50.0" y="188" class="s" text-anchor="middle">-26</text><line x1="92.5" y1="164" x2="92.5" y2="174" stroke="#9fb6cc"/><text x="92.5" y="188" class="s" text-anchor="middle">-24</text><line x1="135.0" y1="164" x2="135.0" y2="170" stroke="#9fb6cc"/><line x1="177.5" y1="164" x2="177.5" y2="174" stroke="#9fb6cc"/><text x="177.5" y="188" class="s" text-anchor="middle">-20</text><line x1="220.0" y1="164" x2="220.0" y2="170" stroke="#9fb6cc"/><line x1="262.5" y1="164" x2="262.5" y2="174" stroke="#9fb6cc"/><text x="262.5" y="188" class="s" text-anchor="middle">-16</text><line x1="305.0" y1="164" x2="305.0" y2="170" stroke="#9fb6cc"/><line x1="347.5" y1="164" x2="347.5" y2="174" stroke="#9fb6cc"/><text x="347.5" y="188" class="s" text-anchor="middle">-12</text><line x1="390.0" y1="164" x2="390.0" y2="170" stroke="#9fb6cc"/><line x1="432.5" y1="164" x2="432.5" y2="174" stroke="#9fb6cc"/><text x="432.5" y="188" class="s" text-anchor="middle">-8</text><line x1="475.0" y1="164" x2="475.0" y2="170" stroke="#9fb6cc"/><line x1="517.5" y1="164" x2="517.5" y2="174" stroke="#9fb6cc"/><text x="517.5" y="188" class="s" text-anchor="middle">-4</text><line x1="560.0" y1="164" x2="560.0" y2="170" stroke="#9fb6cc"/><line x1="602.5" y1="164" x2="602.5" y2="174" stroke="#9fb6cc"/><text x="602.5" y="188" class="s" text-anchor="middle">0</text><line x1="645.0" y1="164" x2="645.0" y2="170" stroke="#9fb6cc"/><line x1="687.5" y1="164" x2="687.5" y2="174" stroke="#9fb6cc"/><text x="687.5" y="188" class="s" text-anchor="middle">+4</text><line x1="730.0" y1="164" x2="730.0" y2="170" stroke="#9fb6cc"/><text x="103" y="155" class="l" text-anchor="middle">no decode</text><line x1="156.2" y1="120" x2="156.2" y2="164" stroke="#fff" stroke-width="2"/><text x="156.2" y="114" class="l" text-anchor="middle">FT8 limit about -21 dB</text><path d="M390.0,136 l-8,-14 h16 z" fill="#ffb23f"/><text x="390.0" y="116" class="a" text-anchor="middle">me at VK9XY: -10 dB</text><path d="M347.5,151 l-7,13 h14 z" fill="#7ee0a0"/><text x="337.5" y="220" class="g" text-anchor="end">VK9XY at me: -12 dB</text><line x1="347.5" y1="192" x2="341.5" y2="208" stroke="#7ee0a0"/><line x1="156.2" y1="90" x2="390.0" y2="90" stroke="#ffb23f" stroke-width="2"/><text x="273.1" y="82" class="a" text-anchor="middle">11 dB to spare</text><text x="50" y="254" class="m">Same path, less power (on paper, without fading):</text><text x="60" y="278" class="l">25 W</text><text x="100" y="278" class="s">≈ -10 dB</text><text x="210" y="278" class="l">10 W</text><text x="250" y="278" class="s">≈ -14 dB</text><text x="360" y="278" class="l">5 W</text><text x="400" y="278" class="s">≈ -17 dB</text><text x="510" y="278" class="l">2 W</text><text x="550" y="278" class="s">≈ -21 dB</text><text x="645" y="155" class="m" text-anchor="middle">voice needs this side →</text><text x="50" y="30" class="s">Signal-to-noise as WSJT-X reports it (in a 2500 Hz bandwidth)</text></svg>