<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, Arial, sans-serif" font-size="14">
<rect width="760" height="330" fill="#f7f9fb"/>
<text x="20" y="32" font-size="18" font-weight="600" fill="#1b2430">How a 70 cm repeater works (example ON0AND)</text>
<rect x="30" y="120" width="150" height="90" rx="10" fill="#fff" stroke="#9aa7b4"/>
<text x="105" y="152" text-anchor="middle" font-weight="600" fill="#1b2430">Your radio</text>
<text x="105" y="176" text-anchor="middle" fill="#6b7785">FTM-510DE</text>
<rect x="305" y="100" width="150" height="130" rx="10" fill="#fff" stroke="#1E6BA8"/>
<text x="380" y="132" text-anchor="middle" font-weight="600" fill="#1E6BA8">Repeater</text>
<text x="380" y="156" text-anchor="middle" fill="#1b2430">listens 431.3875</text>
<text x="380" y="178" text-anchor="middle" fill="#1b2430">transmits 438.9875</text>
<text x="380" y="204" text-anchor="middle" font-size="12" fill="#6b7785">high site, wide coverage</text>
<rect x="580" y="120" width="150" height="90" rx="10" fill="#fff" stroke="#9aa7b4"/>
<text x="655" y="152" text-anchor="middle" font-weight="600" fill="#1b2430">Other station</text>
<text x="655" y="176" text-anchor="middle" fill="#6b7785">far away</text>
<line x1="180" y1="140" x2="300" y2="140" stroke="#B8791A" stroke-width="3" marker-end="url(#a)"/>
<text x="240" y="128" text-anchor="middle" font-size="12" fill="#B8791A">TX 431.3875 + 131.8 Hz</text>
<line x1="300" y1="190" x2="185" y2="190" stroke="#0E8A50" stroke-width="3" marker-end="url(#b)"/>
<text x="242" y="210" text-anchor="middle" font-size="12" fill="#0E8A50">RX 438.9875</text>
<line x1="455" y1="165" x2="575" y2="165" stroke="#0E8A50" stroke-width="3" marker-end="url(#b2)"/>
<defs>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B8791A"/></marker>
<marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E8A50"/></marker>
<marker id="b2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0E8A50"/></marker>
</defs>
<text x="20" y="268" fill="#1b2430"><tspan font-weight="600">Shift</tspan>: 438.9875 minus 7.6 MHz = 431.3875 (on 2 m the shift is 0.6 MHz).</text>
<text x="20" y="292" fill="#1b2430"><tspan font-weight="600">CTCSS</tspan>: a low tone (here 131.8 Hz) under your voice. No tone, no access.</text>
<text x="20" y="316" fill="#1b2430"><tspan font-weight="600">TN</tspan> sends the tone. <tspan font-weight="600">TSQ</tspan> also only opens your speaker when the repeater sends it back.</text>
</svg>
