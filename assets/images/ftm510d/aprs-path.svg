<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif" font-size="14">
<rect width="760" height="360" fill="#f7f9fb"/>
<text x="20" y="32" font-size="18" font-weight="600" fill="#1b2430">The life of one APRS beacon (144.800 MHz)</text>
<rect x="20" y="70" width="140" height="80" rx="10" fill="#fff" stroke="#9aa7b4"/>
<text x="90" y="100" text-anchor="middle" font-weight="600" fill="#1b2430">Your car</text>
<text x="90" y="122" text-anchor="middle" font-size="12" fill="#6b7785">ON3VZ-9 sends</text>
<text x="90" y="138" text-anchor="middle" font-size="12" fill="#6b7785">a short data burst</text>
<rect x="220" y="70" width="150" height="80" rx="10" fill="#fff" stroke="#B8791A"/>
<text x="295" y="100" text-anchor="middle" font-weight="600" fill="#B8791A">Digipeater</text>
<text x="295" y="122" text-anchor="middle" font-size="12" fill="#6b7785">high site, repeats</text>
<text x="295" y="138" text-anchor="middle" font-size="12" fill="#6b7785">the packet once</text>
<rect x="430" y="70" width="140" height="80" rx="10" fill="#fff" stroke="#0E8A50"/>
<text x="500" y="100" text-anchor="middle" font-weight="600" fill="#0E8A50">iGate</text>
<text x="500" y="122" text-anchor="middle" font-size="12" fill="#6b7785">radio + internet</text>
<text x="500" y="138" text-anchor="middle" font-size="12" fill="#6b7785">passes it on</text>
<rect x="620" y="70" width="120" height="80" rx="10" fill="#fff" stroke="#1E6BA8"/>
<text x="680" y="100" text-anchor="middle" font-weight="600" fill="#1E6BA8">aprs.fi</text>
<text x="680" y="122" text-anchor="middle" font-size="12" fill="#6b7785">dot on the map</text>
<line x1="160" y1="110" x2="215" y2="110" stroke="#1b2430" stroke-width="2" marker-end="url(#m)"/>
<line x1="370" y1="110" x2="425" y2="110" stroke="#1b2430" stroke-width="2" marker-end="url(#m)"/>
<line x1="570" y1="110" x2="615" y2="110" stroke="#1b2430" stroke-width="2" marker-end="url(#m)"/>
<path d="M90,150 C90,230 420,230 420,170" fill="none" stroke="#9aa7b4" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#m)"/>
<text x="250" y="222" font-size="12" fill="#6b7785">close to an iGate? It can also go there directly</text>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2430"/></marker></defs>
<text x="20" y="270" fill="#1b2430"><tspan font-weight="600">Inside the beacon:</tspan> callsign ON3VZ-9, position, speed, course, altitude, symbol (car),</text>
<text x="20" y="292" fill="#1b2430">position comment (En Route), optional status text, and the path WIDE1-1,WIDE2-1.</text>
<text x="20" y="320" fill="#1b2430"><tspan font-weight="600">Other radios nearby</tspan> hear it too: you appear in their station list with distance and direction.</text>
</svg>
