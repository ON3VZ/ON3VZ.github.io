<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Signal chain: radar to RAP to measurement qualifier to autopilot to landing, with the velocity fault marked in red.">
  <defs>
    <style>
      .lbl{font-family:'Share Tech Mono',monospace;fill:#b0c4d8}
      .ttl{font-family:'Orbitron',monospace;fill:#e2eaf5;font-weight:700}
      .kick{font-family:'Share Tech Mono',monospace;fill:#7a96b0;letter-spacing:.12em}
      .ok{fill:#00ff88}.cy{fill:#00d4ff}.am{fill:#f0a500}.rd{fill:#ff4466}
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#7a96b0"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#ff4466"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="300" rx="14" fill="#0d1428" stroke="rgba(0,255,136,0.14)"/>
  <text x="24" y="34" class="kick" font-size="12">SIGNAL CHAIN</text>

  <!-- 1 RADAR -->
  <rect x="24" y="70" width="176" height="120" rx="10" fill="#111d35" stroke="rgba(0,212,255,0.45)"/>
  <text x="112" y="98" text-anchor="middle" class="ttl" font-size="13">KaRA RADAR</text>
  <text x="112" y="120" text-anchor="middle" class="lbl" font-size="11">FMCW · Ka-band</text>
  <path d="M52 150 q18 -22 36 0 t36 0 t36 0" fill="none" stroke="#00d4ff" stroke-width="2"/>
  <text x="112" y="176" text-anchor="middle" class="cy" font-size="10.5">up-chirp + down-chirp</text>

  <!-- 2 RAP -->
  <rect x="256" y="70" width="196" height="120" rx="10" fill="#111d35" stroke="rgba(0,255,136,0.30)"/>
  <text x="354" y="98" text-anchor="middle" class="ttl" font-size="13">RAP</text>
  <text x="354" y="118" text-anchor="middle" class="lbl" font-size="10.5">8192-pt FFT · find peaks</text>
  <rect x="272" y="132" width="164" height="24" rx="5" fill="rgba(0,255,136,0.10)"/>
  <text x="282" y="149" class="ok" font-size="11">ALTITUDE</text>
  <text x="428" y="149" text-anchor="end" class="ok" font-size="11">✓ good</text>
  <rect x="272" y="160" width="164" height="24" rx="5" fill="rgba(255,68,102,0.10)"/>
  <text x="282" y="177" class="am" font-size="11">VELOCITY</text>
  <text x="428" y="177" text-anchor="end" class="rd" font-size="11">noise @ low modes</text>

  <!-- 3 QUALIFIER -->
  <rect x="508" y="60" width="196" height="140" rx="10" fill="#111d35" stroke="#00ff88" stroke-width="1.5"/>
  <rect x="508" y="60" width="196" height="22" rx="10" fill="rgba(0,255,136,0.14)"/>
  <text x="606" y="76" text-anchor="middle" class="ok" font-size="10.5" font-family="'Share Tech Mono',monospace">◄ ONLY EDITABLE BLOCK</text>
  <text x="606" y="108" text-anchor="middle" class="ttl" font-size="12.5">MEASUREMENT</text>
  <text x="606" y="124" text-anchor="middle" class="ttl" font-size="12.5">QUALIFIER</text>
  <text x="606" y="150" text-anchor="middle" class="lbl" font-size="10.5">one check:</text>
  <text x="606" y="167" text-anchor="middle" class="cy" font-size="10.5">|up − dn| &gt; 40 bins ?</text>
  <text x="606" y="188" text-anchor="middle" class="rd" font-size="10">noisy velocity slips through</text>

  <!-- 4 AUTOPILOT -->
  <rect x="760" y="70" width="176" height="120" rx="10" fill="#111d35" stroke="rgba(240,165,0,0.45)"/>
  <text x="848" y="98" text-anchor="middle" class="ttl" font-size="13">AUTOPILOT</text>
  <text x="848" y="122" text-anchor="middle" class="lbl" font-size="10.5">below 30 m &amp;</text>
  <text x="848" y="138" text-anchor="middle" class="lbl" font-size="10.5">vel &gt; 20 m/s</text>
  <text x="848" y="164" text-anchor="middle" class="rd" font-size="11.5" font-family="'Orbitron',monospace" font-weight="700">→ CRASH</text>

  <!-- arrows -->
  <line x1="200" y1="130" x2="252" y2="130" stroke="#7a96b0" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="452" y1="144" x2="504" y2="130" stroke="#00ff88" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="452" y1="172" x2="504" y2="150" stroke="#ff4466" stroke-width="2" marker-end="url(#arR)"/>
  <line x1="704" y1="130" x2="756" y2="130" stroke="#ff4466" stroke-width="2" marker-end="url(#arR)"/>

  <!-- caption -->
  <text x="24" y="286" class="lbl" font-size="10.5">Altitude is fine at every mode. The velocity path is where the fault lives, and the qualifier waves it through.</text>
</svg>
