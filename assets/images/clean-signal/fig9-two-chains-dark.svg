<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Two compliments, two chains: what makes a signal clean, what makes it loud, and what decides how well I hear" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
<title>Two compliments, two chains: what makes a signal clean, what makes it loud, and what decides how well I hear</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9BDCF"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F06A7B"/></marker>
