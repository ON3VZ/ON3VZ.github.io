<rect x="354" y="290" width="150" height="40" rx="6" fill="#1A2C40" stroke="#F0B323" stroke-width="1.5"/>
<text x="429.0" y="315" font-size="11" fill="#E4EDF5" text-anchor="middle" font-weight="normal">Mains and DC</text>
<line x1="504" y1="310" x2="516" y2="310" stroke="#A9BDCF" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="516" y="290" width="150" height="40" rx="6" fill="#1A2C40" stroke="#F0B323" stroke-width="1.5"/>
<text x="591.0" y="315" font-size="11" fill="#E4EDF5" text-anchor="middle" font-weight="normal">Antenna</text>
<line x1="666" y1="310" x2="678" y2="310" stroke="#A9BDCF" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="678" y="290" width="150" height="40" rx="6" fill="#1A2C40" stroke="#F0B323" stroke-width="1.5"/>
<text x="753.0" y="315" font-size="11" fill="#E4EDF5" text-anchor="middle" font-weight="normal">Receiver</text>
<text x="30" y="380" font-size="12" fill="#A9BDCF" text-anchor="start" font-weight="normal">Chokes and ferrites act in all three chains: they control the same unwanted current path in both directions.</text>
