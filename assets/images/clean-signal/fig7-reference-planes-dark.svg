<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-label="The station chain with reference planes and the three questions: resonance, match, efficiency" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
<title>The station chain with reference planes and the three questions: resonance, match, efficiency</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9BDCF"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F06A7B"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2FD68A"/></marker></defs>
<rect x="1" y="1" width="998" height="328" rx="16" fill="#142334" stroke="#2E4560" stroke-width="2"/>
<rect x="60" y="80" width="140" height="50" rx="6" fill="#1A2C40" stroke="#2FD68A" stroke-width="1.5"/>
<text x="130" y="110" font-size="13" fill="#E4EDF5" text-anchor="middle" font-weight="normal">Antenna</text>
<rect x="280" y="80" width="140" height="50" rx="6" fill="#1A2C40" stroke="#2FD68A" stroke-width="1.5"/>
<text x="350" y="110" font-size="13" fill="#E4EDF5" text-anchor="middle" font-weight="normal">Transformer</text>
<rect x="560" y="80" width="140" height="50" rx="6" fill="#1A2C40" stroke="#2FD68A" stroke-width="1.5"/>
<text x="630" y="110" font-size="13" fill="#E4EDF5" text-anchor="middle" font-weight="normal">End of coax</text>
<rect x="820" y="80" width="140" height="50" rx="6" fill="#1A2C40" stroke="#2FD68A" stroke-width="1.5"/>
<text x="890" y="110" font-size="13" fill="#E4EDF5" text-anchor="middle" font-weight="normal">Radio</text>
<line x1="200" y1="105" x2="280" y2="105" stroke="#E4EDF5" stroke-width="2"/>
<line x1="420" y1="105" x2="560" y2="105" stroke="#E4EDF5" stroke-width="3"/>
<text x="490" y="95" font-size="11" fill="#A9BDCF" text-anchor="middle" font-weight="normal">coax, about 16 m</text>
<line x1="700" y1="105" x2="820" y2="105" stroke="#E4EDF5" stroke-width="2"/>
<line x1="240" y1="60" x2="240" y2="160" stroke="#F0B323" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="240" y="180" font-size="11" fill="#F0B323" text-anchor="middle" font-weight="normal">plane A</text>
<line x1="490" y1="60" x2="490" y2="160" stroke="#F0B323" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="490" y="180" font-size="11" fill="#F0B323" text-anchor="middle" font-weight="normal">plane B</text>
<line x1="760" y1="60" x2="760" y2="160" stroke="#F0B323" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="760" y="180" font-size="11" fill="#F0B323" text-anchor="middle" font-weight="normal">plane C</text>
<rect x="60" y="220" width="280" height="80" rx="6" fill="#1A2C40" stroke="#5AB4EA" stroke-width="1.5"/>
<text x="200" y="252" font-size="14" fill="#5AB4EA" text-anchor="middle" font-weight="normal">Is it resonant?</text>
<text x="200" y="278" font-size="11" fill="#A9BDCF" text-anchor="middle" font-weight="normal">net reactance at the plane is zero</text>
<rect x="370" y="220" width="280" height="80" rx="6" fill="#1A2C40" stroke="#5AB4EA" stroke-width="1.5"/>
<text x="510" y="252" font-size="14" fill="#5AB4EA" text-anchor="middle" font-weight="normal">Is it matched?</text>
<text x="510" y="278" font-size="11" fill="#A9BDCF" text-anchor="middle" font-weight="normal">how close to 50 ohm, shown as SWR</text>
<rect x="680" y="220" width="280" height="80" rx="6" fill="#1A2C40" stroke="#5AB4EA" stroke-width="1.5"/>
<text x="820" y="252" font-size="14" fill="#5AB4EA" text-anchor="middle" font-weight="normal">Is it efficient?</text>
<text x="820" y="278" font-size="11" fill="#A9BDCF" text-anchor="middle" font-weight="normal">radiated power versus heat; SWR cannot tell</text>
<text x="60" y="40" font-size="12" fill="#A9BDCF" text-anchor="start" font-weight="normal">Every SWR or impedance value belongs to a reference plane. My 3:1 on 80 m is read at the radio.</text>
</svg>