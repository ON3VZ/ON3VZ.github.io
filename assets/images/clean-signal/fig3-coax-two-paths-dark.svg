<text x="640" y="90" font-size="12" fill="#F06A7B" text-anchor="middle" font-weight="normal">current on the outside of the shield reaches the shack</text>
<text x="60" y="206" font-size="11" fill="#A9BDCF" text-anchor="start" font-weight="normal">antenna side</text>
<text x="880" y="206" font-size="11" fill="#A9BDCF" text-anchor="end" font-weight="normal">shack side</text>
<text x="40" y="290" font-size="15" fill="#E4EDF5" text-anchor="start" font-weight="normal">With a choke</text>
<rect x="60" y="308" width="820" height="44" rx="22" fill="none" stroke="#A9BDCF" stroke-width="2"/>
<rect x="60" y="322" width="820" height="16" rx="8" fill="none" stroke="#2FD68A" stroke-width="1.5"/>
<line x1="90" y1="328" x2="840" y2="328" stroke="#2FD68A" stroke-width="2" marker-end="url(#arG)"/>
<line x1="840" y1="333" x2="90" y2="333" stroke="#2FD68A" stroke-width="2" marker-end="url(#arG)"/>
<text x="470" y="384" font-size="12" fill="#2FD68A" text-anchor="middle" font-weight="normal">wanted signal: centre conductor and inside of shield, equal and opposite</text>
<rect x="440" y="296" width="60" height="68" rx="8" fill="#F0B323" opacity="0.85"/>
<text x="470" y="288" font-size="12" fill="#F0B323" text-anchor="middle" font-weight="normal">choke</text>
