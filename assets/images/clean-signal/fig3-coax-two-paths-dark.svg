<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" role="img" aria-label="Coax as a tube in a tube: wanted signal inside, unwanted current outside, blocked by a choke" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
<title>Coax as a tube in a tube: wanted signal inside, unwanted current outside, blocked by a choke</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9BDCF"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#F06A7B"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2FD68A"/></marker></defs>
<rect x="1" y="1" width="938" height="438" rx="16" fill="#142334" stroke="#2E4560" stroke-width="2"/>
<text x="40" y="90" font-size="15" fill="#E4EDF5" text-anchor="start" font-weight="normal">Without a choke</text>
