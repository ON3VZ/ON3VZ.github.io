<line x1="840" y1="133" x2="90" y2="133" stroke="#2FD68A" stroke-width="2" marker-end="url(#arG)"/>
<text x="470" y="184" font-size="12" fill="#2FD68A" text-anchor="middle" font-weight="normal">wanted signal: centre conductor and inside of shield, equal and opposite</text>
