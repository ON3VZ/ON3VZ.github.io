<text x="260" y="290" font-size="12" fill="#F06A7B" text-anchor="middle" font-weight="normal">outside current blocked here</text>
<text x="60" y="406" font-size="11" fill="#A9BDCF" text-anchor="start" font-weight="normal">antenna side</text>
<text x="880" y="406" font-size="11" fill="#A9BDCF" text-anchor="end" font-weight="normal">shack side</text>
