<text x="110" y="415" font-size="12" fill="#3A546B" text-anchor="middle" font-weight="normal">heavy snap-on ferrites</text>
<line x1="500" y1="470" x2="500" y2="370" stroke="#1E6BA8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="491.0" y="407.4" width="18" height="25.2" rx="4" fill="#B8791A" opacity="0.9"/>
<rect x="395.0" y="444" width="210" height="52" rx="6" fill="#F2F6F9" stroke="#C9D5DF" stroke-width="1.5"/>
<text x="500" y="466" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="normal">Mains</text>
<text x="500" y="485" font-size="12" fill="#3A546B" text-anchor="middle" font-weight="normal">Schaffner filter, own circuit</text>
<line x1="890" y1="400" x2="670" y2="330" stroke="#1E6BA8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="771.0" y="352.4" width="18" height="25.2" rx="4" fill="#B8791A" opacity="0.9"/>
<rect x="785.0" y="374" width="210" height="52" rx="6" fill="#F2F6F9" stroke="#C9D5DF" stroke-width="1.5"/>
<text x="890" y="396" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="normal">DC supply</text>
<text x="890" y="415" font-size="12" fill="#3A546B" text-anchor="middle" font-weight="normal">Mean Well plus DC filter</text>
<line x1="890" y1="120" x2="670" y2="190" stroke="#1E6BA8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="771.0" y="142.4" width="18" height="25.2" rx="4" fill="#B8791A" opacity="0.9"/>
<rect x="785.0" y="94" width="210" height="52" rx="6" fill="#F2F6F9" stroke="#C9D5DF" stroke-width="1.5"/>
<text x="890" y="116" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="normal">Device cables</text>
<text x="890" y="135" font-size="12" fill="#3A546B" text-anchor="middle" font-weight="normal">ferrites on HDMI, USB, audio</text>
<line x1="500" y1="50" x2="500" y2="150" stroke="#1E6BA8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="491.0" y="87.4" width="18" height="25.2" rx="4" fill="#B8791A" opacity="0.9"/>
<rect x="395.0" y="24" width="210" height="52" rx="6" fill="#F2F6F9" stroke="#C9D5DF" stroke-width="1.5"/>
<text x="500" y="46" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="normal">Network</text>
<text x="500" y="65" font-size="12" fill="#3A546B" text-anchor="middle" font-weight="normal">shielded cable</text>
<rect x="33" y="490.2" width="14" height="19.599999999999998" rx="4" fill="#B8791A" opacity="0.9"/>
<text x="54" y="505" font-size="12" fill="#3A546B" text-anchor="start" font-weight="normal">filter or choke on each path, both directions</text>
