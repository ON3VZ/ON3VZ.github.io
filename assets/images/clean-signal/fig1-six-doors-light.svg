<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 530" role="img" aria-label="The shack with six ways in and out, each with its own filter or choke" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
<title>The shack with six ways in and out, each with its own filter or choke</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A546B"/></marker>
<marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C8384B"/></marker>
<marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E8A50"/></marker></defs>
<rect x="1" y="1" width="998" height="528" rx="16" fill="#FFFFFF" stroke="#C9D5DF" stroke-width="2"/>
<rect x="330" y="150" width="340" height="220" rx="6" fill="#F2F6F9" stroke="#0E8A50" stroke-width="2"/>
<text x="500" y="250" font-size="22" fill="#0B1E30" text-anchor="middle" font-weight="normal">The shack</text>
<text x="500" y="276" font-size="13" fill="#3A546B" text-anchor="middle" font-weight="normal">one room, six ways in and out</text>
<line x1="110" y1="120" x2="330" y2="190" stroke="#1E6BA8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="211.0" y="142.4" width="18" height="25.2" rx="4" fill="#B8791A" opacity="0.9"/>
<rect x="5.0" y="94" width="210" height="52" rx="6" fill="#F2F6F9" stroke="#C9D5DF" stroke-width="1.5"/>
<text x="110" y="116" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="normal">Coax</text>
<text x="110" y="135" font-size="12" fill="#3A546B" text-anchor="middle" font-weight="normal">chokes along the line</text>
<line x1="110" y1="400" x2="330" y2="330" stroke="#1E6BA8" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<rect x="211.0" y="352.4" width="18" height="25.2" rx="4" fill="#B8791A" opacity="0.9"/>
