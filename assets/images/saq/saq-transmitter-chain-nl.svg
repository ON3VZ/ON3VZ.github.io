<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img"><title>Zenderketen van SAQ Grimeton en waar de seinsleutel ingrijpt</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="720" height="560" rx="14" fill="#FFFFFF"/><g style="font-family:'Segoe UI',Arial,Helvetica,sans-serif"><rect x="215" y="24" width="290" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="360.0" y="44.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#2C2C2A">Net</text><text x="360.0" y="64.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#5F5E5A">Driefase naar tweefase</text><rect x="215" y="104" width="290" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="360.0" y="124.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#2C2C2A">Inductiemotor, 500 pk</text><text x="360.0" y="144.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#5F5E5A">711,3 tpm, compensatieweerstand</text><rect x="215" y="184" width="290" height="58" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="360.0" y="204.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#2C2C2A">Tandwielkast</text><text x="360.0" y="224.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#5F5E5A">Ongeveer 3 keer sneller</text><rect x="215" y="264" width="290" height="58" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/><text x="360.0" y="284.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#712B13">Alexanderson-alternator</text><text x="360.0" y="304.0" text-