<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="'Share Tech Mono','JetBrains Mono',monospace">
<!-- HAMCLOCK 2026-11-14: hookup diagram. Remove together with the post to revert. -->
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9fb6cc"/></marker></defs>
<rect width="980" height="600" rx="10" fill="#080d18"/>
<text x="490.0" y="36" text-anchor="middle" fill="#e2eaf5" font-size="20">How to connect a ready-made HamClock</text>
<text x="490.0" y="60" text-anchor="middle" fill="#7a96b0" font-size="13">One small box, five cables. The clock does not connect to your radio: everything comes over the internet.</text>
<rect x="370" y="230" width="240" height="130" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="490.0" y="277.5" text-anchor="middle" fill="#00ff88" font-size="17">HamClock box</text>
<text x="490.0" y="303.5" text-anchor="middle" fill="#e2eaf5" font-size="13">mini PC or Raspberry Pi</text>
<text x="490.0" y="323.5" text-anchor="middle" fill="#e2eaf5" font-size="13">starts HamClock by itself</text>
<rect x="40" y="100" width="250" height="110" rx="10" fill="#0c1424" stroke="#38d6ff" stroke-width="2"/>
<text x="165.0" y="137.5" text-anchor="middle" fill="#38d6ff" font-size="17">Screen or TV</text>
<text x="165.0" y="163.5" text-anchor="middle" fill="#e2eaf5" font-size="13">HDMI input</text>
<text x="165.0" y="183.5" text-anchor="middle" fill="#e2eaf5" font-size="13">pick the right HDMI source</text>
<rect x="690" y="100" width="250" height="110" rx="10" fill="#0c1424" stroke="#ffb020" stroke-width="2"/>
<text x="815.0" y="137.5" text-anchor="middle" fill="#ffb020" font-size="17">Router or switch</text>
<text x="815.0" y="163.5" text-anchor="middle" fill="#e2eaf5" font-size="13">network cable (UTP)</text>
<text x="815.0" y="183.5" text-anchor="middle" fill="#e2eaf5" font-size="13">or Wi-Fi after first setup</text>
<rect x="40" y="400" width="250" height="110" rx="10" fill="#0c1424" stroke="#b78bff" stroke-width="2"/>
<text x="165.0" y="437.5" text-anchor="middle" fill="#b78bff" font-size="17">Mouse + keyboard</text>
<text x="165.0" y="463.5" text-anchor="middle" fill="#e2eaf5" font-size="13">USB, first setup only</text>
<text x="165.0" y="483.5" text-anchor="middle" fill="#e2eaf5" font-size="13">then remove them</text>
<rect x="690" y="400" width="250" height="110" rx="10" fill="#0c1424" stroke="#ff4466" stroke-width="2"/>
<text x="815.0" y="437.5" text-anchor="middle" fill="#ff4466" font-size="17">Power supply</text>
<text x="815.0" y="463.5" text-anchor="middle" fill="#e2eaf5" font-size="13">the adapter supplied</text>
<text x="815.0" y="483.5" text-anchor="middle" fill="#e2eaf5" font-size="13">never pull it while running</text>
<line x1="370" y1="260" x2="292" y2="212" stroke="#38d6ff" stroke-width="2" marker-end="url(#ar)"/>
<text x="345" y="222" text-anchor="end" fill="#38d6ff" font-size="13">HDMI</text>
<line x1="610" y1="260" x2="688" y2="212" stroke="#ffb020" stroke-width="2" marker-end="url(#ar)"/>
<text x="635" y="222" text-anchor="start" fill="#ffb020" font-size="13">UTP</text>
<line x1="370" y1="330" x2="292" y2="410" stroke="#b78bff" stroke-width="2" marker-end="url(#ar)"/>
<text x="345" y="385" text-anchor="end" fill="#b78bff" font-size="13">USB</text>
<line x1="688" y1="410" x2="610" y2="330" stroke="#ff4466" stroke-width="2" marker-end="url(#ar)"/>
<text x="640" y="385" text-anchor="start" fill="#ff4466" font-size="13">DC</text>
<text x="490" y="560" text-anchor="middle" fill="#7a96b0" font-size="12">Raspberry Pi 4 or 5: you need a micro-HDMI to HDMI cable. Touch screens need HDMI plus a USB cable for the touch.</text>
<text x="490" y="580" text-anchor="middle" fill="#7a96b0" font-size="12">After setup, control everything from a browser on your PC: http://IP-of-your-clock:8081/live.html</text>
</svg>
