<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" font-family="'Share Tech Mono','JetBrains Mono',monospace">
<!-- HAMCLOCK 2026-11-14: decision tree. Remove together with the post to revert. -->
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9fb6cc"/></marker></defs>
<rect width="980" height="700" rx="10" fill="#080d18"/>
