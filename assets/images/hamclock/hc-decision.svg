<text x="330" y="330" text-anchor="middle" fill="#ff4466" font-size="13">no</text>
<rect x="30" y="375" width="170" height="80" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="115.0" y="407.5" text-anchor="middle" fill="#00ff88" font-size="17">Done</text>
