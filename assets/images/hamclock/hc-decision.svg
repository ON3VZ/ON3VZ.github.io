<text x="630" y="330" text-anchor="middle" fill="#ff4466" font-size="13">no</text>
<line x1="840" y1="290" x2="840" y2="370" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<text x="860" y="330" text-anchor="middle" fill="#00ff88" font-size="13">yes</text>
