<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="'Share Tech Mono','JetBrains Mono',monospace">
<!-- HAMCLOCK 2026-11-14: inside the box. Remove together with the post to revert. -->
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9fb6cc"/></marker></defs>
<rect width="980" height="600" rx="10" fill="#080d18"/>
<text x="490.0" y="36" text-anchor="middle" fill="#e2eaf5" font-size="20">Inside a ready-made HamClock box</text>
<text x="490.0" y="60" text-anchor="middle" fill="#7a96b0" font-size="13">A small computer with a screen output. This is the type ON4RF builds; other boxes can differ in the details.</text>
<rect x="150" y="90" width="680" height="400" rx="14" fill="#0a111f" stroke="#00ff88" stroke-width="2"/>
<text x="490" y="118" text-anchor="middle" fill="#00ff88" font-size="16">The box (a mini PC)</text>
<rect x="175" y="140" width="190" height="70" rx="10" fill="#0c1424" stroke="#38d6ff" stroke-width="2"/>
<text x="270.0" y="166.5" text-anchor="middle" fill="#38d6ff" font-size="15">Processor</text>
<text x="270.0" y="192.5" text-anchor="middle" fill="#e2eaf5" font-size="13">Intel, 64 bit</text>
<rect x="390" y="140" width="190" height="70" rx="10" fill="#0c1424" stroke="#38d6ff" stroke-width="2"/>
<text x="485.0" y="166.5" text-anchor="middle" fill="#38d6ff" font-size="15">Memory</text>
<text x="485.0" y="192.5" text-anchor="middle" fill="#e2eaf5" font-size="13">2 GB RAM</text>
<rect x="605" y="140" width="200" height="70" rx="10" fill="#0c1424" stroke="#38d6ff" stroke-width="2"/>
<text x="705.0" y="166.5" text-anchor="middle" fill="#38d6ff" font-size="15">Storage</text>
<text x="705.0" y="192.5" text-anchor="middle" fill="#e2eaf5" font-size="13">32 GB + micro-SD slot</text>
<rect x="175" y="235" width="630" height="120" rx="8" fill="#0c1424" stroke="#1d3050"/>
<text x="490" y="258" text-anchor="middle" fill="#7a96b0" font-size="12">Software, from bottom to top</text>
<rect x="190" y="268" width="200" height="72" rx="10" fill="#0c1424" stroke="#b78bff" stroke-width="2"/>
<text x="290.0" y="295.5" text-anchor="middle" fill="#b78bff" font-size="14">Operating system</text>
<text x="290.0" y="320.5" text-anchor="middle" fill="#e2eaf5" font-size="12">Ubuntu MATE (Linux)</text>
<rect x="400" y="268" width="200" height="72" rx="10" fill="#0c1424" stroke="#ffb020" stroke-width="2"/>
<text x="500.0" y="295.5" text-anchor="middle" fill="#ffb020" font-size="14">HamClock program</text>
<text x="500.0" y="320.5" text-anchor="middle" fill="#e2eaf5" font-size="12">starts by itself</text>
<rect x="610" y="268" width="185" height="72" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="702.5" y="295.5" text-anchor="middle" fill="#00ff88" font-size="14">Built-in web server</text>
<text x="702.5" y="320.5" text-anchor="middle" fill="#e2eaf5" font-size="12">ports 8080, 8081, 8082</text>
<rect x="190" y="385" width="84" height="42" rx="6" fill="#0c1424" stroke="#38d6ff" stroke-width="2"/>
<text x="232" y="411" text-anchor="middle" fill="#38d6ff" font-size="13">HDMI</text>
<rect x="290" y="385" width="84" height="42" rx="6" fill="#0c1424" stroke="#b78bff" stroke-width="2"/>
<text x="332" y="411" text-anchor="middle" fill="#b78bff" font-size="13">USB</text>
<rect x="390" y="385" width="84" height="42" rx="6" fill="#0c1424" stroke="#ffb020" stroke-width="2"/>
<text x="432" y="411" text-anchor="middle" fill="#ffb020" font-size="13">Wi-Fi</text>
<rect x="490" y="385" width="84" height="42" rx="6" fill="#0c1424" stroke="#ffb020" stroke-width="2"/>
<text x="532" y="411" text-anchor="middle" fill="#ffb020" font-size="13">Network</text>
<rect x="590" y="385" width="84" height="42" rx="6" fill="#0c1424" stroke="#9aa8b8" stroke-width="2"/>
<text x="632" y="411" text-anchor="middle" fill="#9aa8b8" font-size="13">Audio</text>
<rect x="690" y="385" width="84" height="42" rx="6" fill="#0c1424" stroke="#ff4466" stroke-width="2"/>
<text x="732" y="411" text-anchor="middle" fill="#ff4466" font-size="13">Power</text>
<text x="490" y="455" text-anchor="middle" fill="#7a96b0" font-size="12">Connections on the outside of the box</text>
<text x="190" y="478" text-anchor="start" fill="#7a96b0" font-size="11">Network port: check whether your box has one. Without it, use Wi-Fi.</text>
<text x="490" y="535" text-anchor="middle" fill="#7a96b0" font-size="12">HDMI goes to your screen. USB is for mouse and keyboard. Wi-Fi or the network cable brings the data. Power comes from the adapter.</text>
<text x="490" y="556" text-anchor="middle" fill="#7a96b0" font-size="12">There is no connection to your radio: the box only reads data from the internet.</text>
</svg>
