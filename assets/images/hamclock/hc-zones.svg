<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="'Share Tech Mono','JetBrains Mono',monospace">
<!-- HAMCLOCK 2026-11-14: screen zones. Remove together with the post to revert. -->
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9fb6cc"/></marker></defs>
<rect width="980" height="620" rx="10" fill="#080d18"/>
<text x="490.0" y="36" text-anchor="middle" fill="#e2eaf5" font-size="20">The five zones of the HamClock screen</text>
<text x="490.0" y="60" text-anchor="middle" fill="#7a96b0" font-size="13">Every box can show different data. Click the top left corner of a box to choose what it shows.</text>
<rect x="40" y="80" width="900" height="500" fill="#05080f" stroke="#1d3050"/>
<rect x="50" y="90" width="230" height="150" rx="6" fill="#00ff88" fill-opacity="0.12" stroke="#00ff88" stroke-width="2"/>
<circle cx="72" cy="112" r="14" fill="#00ff88"/><text x="72" y="117" text-anchor="middle" fill="#080d18" font-size="15">1</text>
<text x="165.0" y="165.0" text-anchor="middle" fill="#00ff88" font-size="15">Local info pane</text>
<text x="165.0" y="185.0" text-anchor="middle" fill="#e2eaf5" font-size="12">call, UTC clock, server, lock</text>
<rect x="290" y="90" width="175" height="150" rx="6" fill="#38d6ff" fill-opacity="0.12" stroke="#38d6ff" stroke-width="2"/>
<circle cx="312" cy="112" r="14" fill="#38d6ff"/><text x="312" y="117" text-anchor="middle" fill="#080d18" font-size="15">2</text>
<text x="377.5" y="165.0" text-anchor="middle" fill="#38d6ff" font-size="15">Data pane A</text>
<text x="377.5" y="185.0" text-anchor="middle" fill="#e2eaf5" font-size="12">e.g. Contests</text>
<rect x="475" y="90" width="175" height="150" rx="6" fill="#38d6ff" fill-opacity="0.12" stroke="#38d6ff" stroke-width="2"/>
<circle cx="497" cy="112" r="14" fill="#38d6ff"/><text x="497" y="117" text-anchor="middle" fill="#080d18" font-size="15">2</text>
<text x="562.5" y="165.0" text-anchor="middle" fill="#38d6ff" font-size="15">Data pane B</text>
<text x="562.5" y="185.0" text-anchor="middle" fill="#e2eaf5" font-size="12">e.g. Moon / SDO</text>
<rect x="660" y="90" width="175" height="150" rx="6" fill="#38d6ff" fill-opacity="0.12" stroke="#38d6ff" stroke-width="2"/>
<circle cx="682" cy="112" r="14" fill="#38d6ff"/><text x="682" y="117" text-anchor="middle" fill="#080d18" font-size="15">2</text>
<text x="747.5" y="165.0" text-anchor="middle" fill="#38d6ff" font-size="15">Data pane C</text>
<text x="747.5" y="185.0" text-anchor="middle" fill="#e2eaf5" font-size="12">e.g. HF Bands</text>
<rect x="845" y="90" width="85" height="150" rx="6" fill="#ffb020" fill-opacity="0.12" stroke="#ffb020" stroke-width="2"/>
<circle cx="867" cy="112" r="14" fill="#ffb020"/><text x="867" y="117" text-anchor="middle" fill="#080d18" font-size="15">3</text>
<text x="887.5" y="165.0" text-anchor="middle" fill="#ffb020" font-size="15">Side</text>
<text x="887.5" y="185.0" text-anchor="middle" fill="#e2eaf5" font-size="12">SSN SFI</text>
<rect x="50" y="250" width="230" height="320" rx="6" fill="#b78bff" fill-opacity="0.12" stroke="#b78bff" stroke-width="2"/>
<circle cx="72" cy="272" r="14" fill="#b78bff"/><text x="72" y="277" text-anchor="middle" fill="#080d18" font-size="15">4</text>
<text x="165.0" y="410.0" text-anchor="middle" fill="#b78bff" font-size="15">Flex panes</text>
<text x="165.0" y="430.0" text-anchor="middle" fill="#e2eaf5" font-size="12">DE and DX boxes,</text>
<text x="165" y="452" text-anchor="middle" fill="#e2eaf5" font-size="12">or one list such as</text>
<text x="165" y="470" text-anchor="middle" fill="#e2eaf5" font-size="12">the DX Cluster</text>
<rect x="290" y="250" width="640" height="320" rx="6" fill="#ff4466" fill-opacity="0.12" stroke="#ff4466" stroke-width="2"/>
<circle cx="312" cy="272" r="14" fill="#ff4466"/><text x="312" y="277" text-anchor="middle" fill="#080d18" font-size="15">5</text>
<text x="610.0" y="410.0" text-anchor="middle" fill="#ff4466" font-size="15">World map</text>
<text x="610.0" y="430.0" text-anchor="middle" fill="#e2eaf5" font-size="12">day and night, grey line, spots, satellites</text>
<text x="610" y="480" text-anchor="middle" fill="#7a96b0" font-size="12">projection, style, grid and layers from the map menu</text>
<text x="490" y="604" text-anchor="middle" fill="#7a96b0" font-size="12">The map is the largest part. Pane 2 has three boxes side by side; pane 3 is the narrow column top right.</text>
</svg>
