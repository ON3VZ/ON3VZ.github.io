<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1180" font-family="'Share Tech Mono','JetBrains Mono',monospace">
<!-- HAMCLOCK 2026-11-22: unboxing flow. Remove together with the post to revert. -->
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9fb6cc"/></marker></defs>
<rect width="980" height="1180" rx="10" fill="#080d18"/>
<text x="490.0" y="36" text-anchor="middle" fill="#e2eaf5" font-size="20">From the box to a working HamClock</text>
<text x="490.0" y="60" text-anchor="middle" fill="#7a96b0" font-size="13">Follow the arrows. Each number is a step in section 9.</text>
<rect x="280.0" y="85" width="420" height="62" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="490.0" y="108.5" text-anchor="middle" fill="#00ff88" font-size="16">1  Unpack and check the kit</text>
<text x="490.0" y="133.5" text-anchor="middle" fill="#e2eaf5" font-size="12">section 9.1</text>
<rect x="280.0" y="175" width="420" height="62" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="490.0" y="198.5" text-anchor="middle" fill="#00ff88" font-size="16">2  Choose a spot near the screen</text>
<text x="490.0" y="223.5" text-anchor="middle" fill="#e2eaf5" font-size="12">section 9.2</text>
<rect x="280.0" y="265" width="420" height="62" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="490.0" y="288.5" text-anchor="middle" fill="#00ff88" font-size="16">3  HDMI, mouse and keyboard</text>
<text x="490.0" y="313.5" text-anchor="middle" fill="#e2eaf5" font-size="12">section 9.3, power not yet</text>
<line x1="490" y1="147" x2="490" y2="173" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<line x1="490" y1="237" x2="490" y2="263" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<line x1="490" y1="327" x2="490" y2="360" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<polygon points="490,362.0 640.0,410 490,458.0 340.0,410" fill="#0c1424" stroke="#ffb020" stroke-width="2"/>
<text x="490" y="408" text-anchor="middle" fill="#ffb020" font-size="14">Can you use a</text>
<text x="490" y="426" text-anchor="middle" fill="#e2eaf5" font-size="12">network cable?</text>
<line x1="340" y1="410" x2="250" y2="410" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<text x="300" y="400" text-anchor="middle" fill="#00ff88" font-size="13">YES</text>
<line x1="640" y1="410" x2="730" y2="410" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<text x="680" y="400" text-anchor="middle" fill="#ff4466" font-size="13">NO</text>
<rect x="40" y="470" width="380" height="90" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="230.0" y="498.0" text-anchor="middle" fill="#00ff88" font-size="16">4A  Route A: cable</text>
<text x="230.0" y="523.0" text-anchor="middle" fill="#e2eaf5" font-size="12">UTP cable box to router</text>
<text x="230.0" y="542.0" text-anchor="middle" fill="#e2eaf5" font-size="12">then power on (5)</text>
<rect x="560" y="470" width="380" height="130" rx="10" fill="#0c1424" stroke="#38d6ff" stroke-width="2"/>
<text x="750.0" y="508.5" text-anchor="middle" fill="#38d6ff" font-size="16">4B  Route B: Wi-Fi</text>
<text x="750.0" y="533.5" text-anchor="middle" fill="#e2eaf5" font-size="12">power on (5), wait for the clock,</text>
<text x="750.0" y="552.5" text-anchor="middle" fill="#e2eaf5" font-size="12">padlock &gt; Exit HamClock,</text>
<text x="750.0" y="571.5" text-anchor="middle" fill="#e2eaf5" font-size="12">choose Wi-Fi, then restart</text>
<line x1="230" y1="410" x2="230" y2="468" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/><line x1="750" y1="410" x2="750" y2="468" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/><polyline points="230,560 230,640 460,640" fill="none" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/><polyline points="750,600 750,640 520,640" fill="none" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/><rect x="330.0" y="615" width="320" height="52" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="490.0" y="633.5" text-anchor="middle" fill="#00ff88" font-size="16">6  First start: let it run</text>
<text x="490.0" y="658.5" text-anchor="middle" fill="#e2eaf5" font-size="12">section 9.4</text>
<line x1="490" y1="667" x2="490" y2="700" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<rect x="280.0" y="702" width="420" height="62" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="490.0" y="725.5" text-anchor="middle" fill="#00ff88" font-size="16">7  Health check: four signs</text>
<text x="490.0" y="750.5" text-anchor="middle" fill="#e2eaf5" font-size="12">section 9.6</text>
<line x1="490" y1="764" x2="490" y2="792" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<polygon points="490,795.0 620.0,840 490,885.0 360.0,840" fill="#0c1424" stroke="#ffb020" stroke-width="2"/>
<text x="490" y="845" text-anchor="middle" fill="#ffb020" font-size="14">All four OK?</text>
<line x1="620" y1="840" x2="720" y2="840" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<text x="680" y="830" text-anchor="middle" fill="#ff4466" font-size="13">NO</text>
<rect x="722" y="800" width="230" height="80" rx="10" fill="#0c1424" stroke="#ff4466" stroke-width="2"/>
<text x="837.0" y="832.5" text-anchor="middle" fill="#ff4466" font-size="16">Something wrong</text>
<text x="837.0" y="857.5" text-anchor="middle" fill="#e2eaf5" font-size="12">section 9.8, then 15</text>
<line x1="490" y1="885" x2="490" y2="920" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<text x="512" y="908" text-anchor="start" fill="#00ff88" font-size="13">YES</text>
<rect x="280.0" y="922" width="420" height="62" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="490.0" y="945.5" text-anchor="middle" fill="#00ff88" font-size="16">8  First settings</text>
<text x="490.0" y="970.5" text-anchor="middle" fill="#e2eaf5" font-size="12">callsign, units, map, layout (9.7)</text>
<line x1="490" y1="984" x2="490" y2="1012" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<rect x="280.0" y="1014" width="420" height="62" rx="10" fill="#0c1424" stroke="#00ff88" stroke-width="2"/>
<text x="490.0" y="1037.5" text-anchor="middle" fill="#00ff88" font-size="16">9  Save, lock, tidy up</text>
<text x="490.0" y="1062.5" text-anchor="middle" fill="#e2eaf5" font-size="12">section 9.9</text>
<line x1="490" y1="1076" x2="490" y2="1100" stroke="#9fb6cc" stroke-width="2" marker-end="url(#ar)"/>
<rect x="380" y="1102" width="220" height="44" rx="22" fill="#00ff88"/><text x="490" y="1130" text-anchor="middle" fill="#080d18" font-size="16">Your clock works!</text>
<text x="490" y="1168" text-anchor="middle" fill="#7a96b0" font-size="12">Takes about 15 minutes with a cable, 25 with Wi-Fi.</text>
</svg>
