<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'Share Tech Mono','JetBrains Mono',monospace">
<!-- HAMCLOCK 2026-11-22: first start screens. Remove together with the post to revert. -->
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9fb6cc"/></marker></defs>
<rect width="980" height="640" rx="10" fill="#080d18"/>
<text x="490.0" y="36" text-anchor="middle" fill="#e2eaf5" font-size="20">Step 6: what you see during the first start</text>
<text x="490.0" y="60" text-anchor="middle" fill="#7a96b0" font-size="13">Illustration, not a real screenshot. What you see may differ slightly per version.</text>
<rect x="40" y="95" width="440" height="230" rx="8" fill="#000" stroke="#1d3050" stroke-width="3"/><circle cx="60" cy="89" r="14" fill="#00ff88"/><text x="60" y="94" text-anchor="middle" fill="#080d18" font-size="15">1</text>
<text x="84" y="94" text-anchor="start" fill="#e2eaf5" font-size="14">Black screen with text (10 to 60 s)</text>
<text x="60" y="135" text-anchor="start" fill="#c8c8c8" font-size="13">Starting HamClock ...</text>
<text x="60" y="157" text-anchor="start" fill="#c8c8c8" font-size="13">Display 1600x960</text>
<text x="60" y="179" text-anchor="start" fill="#c8c8c8" font-size="13">Reading config</text>
<text x="60" y="201" text-anchor="start" fill="#c8c8c8" font-size="13">Checking network ...</text>
<text x="260" y="300" text-anchor="middle" fill="#7a96b0" font-size="12">Do nothing, just wait</text>
<rect x="500" y="95" width="440" height="230" rx="8" fill="#000" stroke="#1d3050" stroke-width="3"/><circle cx="520" cy="89" r="14" fill="#00ff88"/><text x="520" y="94" text-anchor="middle" fill="#080d18" font-size="15">2</text>
<text x="544" y="94" text-anchor="start" fill="#e2eaf5" font-size="14">The setup countdown (about 10 s)</text>
<text x="720" y="170" text-anchor="middle" fill="#ffb020" font-size="15">Click anywhere to enter setup</text>
<text x="720" y="205" text-anchor="middle" fill="#ffb020" font-size="40">9</text>
<text x="720" y="290" text-anchor="middle" fill="#7a96b0" font-size="12">Do not click: the clock starts normally</text>
<rect x="40" y="375" width="440" height="230" rx="8" fill="#000" stroke="#1d3050" stroke-width="3"/><circle cx="60" cy="369" r="14" fill="#00ff88"/><text x="60" y="374" text-anchor="middle" fill="#080d18" font-size="15">3</text>
<text x="84" y="374" text-anchor="start" fill="#e2eaf5" font-size="14">Looking for a time server (NTP)</text>
<text x="260" y="450" text-anchor="middle" fill="#38d6ff" font-size="14">Setting time from NTP ...</text>
<rect x="210" y="480" width="100" height="34" rx="5" fill="none" stroke="#38d6ff" stroke-width="2"/><text x="260" y="503" text-anchor="middle" fill="#38d6ff" font-size="14">Skip</text>
<text x="260" y="580" text-anchor="middle" fill="#7a96b0" font-size="12">Wait, or click Skip to go faster</text>
<rect x="500" y="375" width="440" height="230" rx="8" fill="#000" stroke="#1d3050" stroke-width="3"/><circle cx="520" cy="369" r="14" fill="#00ff88"/><text x="520" y="374" text-anchor="middle" fill="#080d18" font-size="15">4</text>
<text x="544" y="374" text-anchor="start" fill="#e2eaf5" font-size="14">The clock builds up</text>
<rect x="515" y="400" width="150" height="70" fill="#0c1424" stroke="#00ff88"/><text x="590" y="425" text-anchor="middle" fill="#00ff88" font-size="15">ON3VZ</text>
<text x="590" y="455" text-anchor="middle" fill="#e2eaf5" font-size="18">14:32:07</text>
<rect x="675" y="400" width="78" height="70" fill="#0c1424" stroke="#1d3050"/><rect x="760" y="400" width="78" height="70" fill="#0c1424" stroke="#1d3050"/><rect x="845" y="400" width="78" height="70" fill="#0c1424" stroke="#1d3050"/><rect x="515" y="480" width="410" height="110" fill="#0d2a1e" stroke="#1d3050"/><path d="M540,560 C600,500 650,540 700,510 C760,480 820,540 900,500" fill="none" stroke="#38d6ff" stroke-width="1.5"/><text x="720" y="582" text-anchor="middle" fill="#7a96b0" font-size="12">world map, first spots after a few seconds</text>
</svg>
