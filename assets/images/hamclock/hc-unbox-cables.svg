<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'Share Tech Mono','JetBrains Mono',monospace">
<!-- HAMCLOCK 2026-11-22: cable order. Remove together with the post to revert. -->
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9fb6cc"/></marker></defs>
<rect width="980" height="560" rx="10" fill="#080d18"/>
<text x="490.0" y="36" text-anchor="middle" fill="#e2eaf5" font-size="20">Step 3 and 4: plug in the cables in this order</text>
<text x="490.0" y="60" text-anchor="middle" fill="#7a96b0" font-size="13">Power always last. Which ports your box has, and where, differs per model.</text>
<rect x="300" y="200" width="380" height="150" rx="14" fill="#0c1424" stroke="#00ff88" stroke-width="3"/><text x="490" y="232" text-anchor="middle" fill="#00ff88" font-size="16">HamClock box (rear or side)</text>
<rect x="311" y="290" width="48" height="26" rx="4" fill="none" stroke="#38d6ff" stroke-width="2"/><text x="335" y="334" text-anchor="middle" fill="#38d6ff" font-size="12">HDMI</text>
<rect x="391" y="290" width="48" height="26" rx="4" fill="none" stroke="#b78bff" stroke-width="2"/><text x="415" y="334" text-anchor="middle" fill="#b78bff" font-size="12">USB</text>
<rect x="471" y="290" width="48" height="26" rx="4" fill="none" stroke="#b78bff" stroke-width="2"/><text x="495" y="334" text-anchor="middle" fill="#b78bff" font-size="12">USB</text>
<rect x="551" y="290" width="48" height="26" rx="4" fill="none" stroke="#00ff88" stroke-width="2"/><text x="575" y="334" text-anchor="middle" fill="#00ff88" font-size="12">LAN</text>
<rect x="621" y="290" width="48" height="26" rx="4" fill="none" stroke="#ffb020" stroke-width="2"/><text x="645" y="334" text-anchor="middle" fill="#ffb020" font-size="12">DC</text>
<line x1="160" y1="115" x2="335" y2="290" stroke="#38d6ff" stroke-width="2" stroke-dasharray="5 4"/><rect x="30" y="87" width="270" height="56" rx="8" fill="#080d18" stroke="#38d6ff" stroke-width="1.5"/><circle cx="52" cy="115" r="14" fill="#38d6ff"/><text x="52" y="120" text-anchor="middle" fill="#080d18" font-size="15">1</text>
<text x="74" y="111" text-anchor="start" fill="#38d6ff" font-size="14">HDMI cable</text>
<text x="74" y="131" text-anchor="start" fill="#7a96b0" font-size="11">to the screen</text>
<line x1="160" y1="450" x2="415" y2="316" stroke="#b78bff" stroke-width="2" stroke-dasharray="5 4"/><rect x="30" y="422" width="270" height="56" rx="8" fill="#080d18" stroke="#b78bff" stroke-width="1.5"/><circle cx="52" cy="450" r="14" fill="#b78bff"/><text x="52" y="455" text-anchor="middle" fill="#080d18" font-size="15">2</text>
<text x="74" y="455" text-anchor="start" fill="#b78bff" font-size="14">USB mouse</text>
<line x1="450" y1="470" x2="495" y2="316" stroke="#b78bff" stroke-width="2" stroke-dasharray="5 4"/><rect x="320" y="442" width="270" height="56" rx="8" fill="#080d18" stroke="#b78bff" stroke-width="1.5"/><circle cx="342" cy="470" r="14" fill="#b78bff"/><text x="342" y="475" text-anchor="middle" fill="#080d18" font-size="15">3</text>
<text x="364" y="466" text-anchor="start" fill="#b78bff" font-size="14">USB keyboard</text>
<text x="364" y="486" text-anchor="start" fill="#7a96b0" font-size="11">optional, for Wi-Fi</text>
<line x1="770" y1="450" x2="575" y2="316" stroke="#00ff88" stroke-width="2" stroke-dasharray="5 4"/><rect x="640" y="422" width="270" height="56" rx="8" fill="#080d18" stroke="#00ff88" stroke-width="1.5"/><circle cx="662" cy="450" r="14" fill="#00ff88"/><text x="662" y="455" text-anchor="middle" fill="#080d18" font-size="15">4</text>
<text x="684" y="446" text-anchor="start" fill="#00ff88" font-size="14">UTP cable to router</text>
<text x="684" y="466" text-anchor="start" fill="#7a96b0" font-size="11">route A only, if there is a port</text>
<line x1="810" y1="115" x2="645" y2="290" stroke="#ffb020" stroke-width="2" stroke-dasharray="5 4"/><rect x="680" y="87" width="270" height="56" rx="8" fill="#080d18" stroke="#ffb020" stroke-width="1.5"/><circle cx="702" cy="115" r="14" fill="#ffb020"/><text x="702" y="120" text-anchor="middle" fill="#080d18" font-size="15">5</text>
<text x="724" y="111" text-anchor="start" fill="#ffb020" font-size="14">Power supply</text>
<text x="724" y="131" text-anchor="start" fill="#7a96b0" font-size="11">LAST: the box starts by itself</text>
<text x="490" y="540" text-anchor="middle" fill="#7a96b0" font-size="13">No network port? Then skip cable 4 and follow route B (Wi-Fi) after power on.</text>
</svg>
