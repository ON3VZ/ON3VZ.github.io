<text x="668" y="438" font-size="13" fill="#A9BDCF" text-anchor="start" font-weight="normal">many gaps in a row: the robot</text>
<text x="668" y="456" font-size="13" fill="#A9BDCF" text-anchor="start" font-weight="normal">voice, then silence</text>
