<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Two safety nets: spare bits repair a damaged bit, and a lost frame is replaced by repeating the last good one" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
<title>Two safety nets: spare bits repair a damaged bit, and a lost frame is replaced by repeating the last good one</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9BDCF"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5AB4EA"/></marker></defs>
<rect x="1" y="1" width="998" height="498" rx="16" fill="#142334" stroke="#2E4560" stroke-width="2"/>
