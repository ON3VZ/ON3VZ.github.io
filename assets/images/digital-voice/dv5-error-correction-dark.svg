<text x="506" y="374" font-size="15" fill="#F06A7B" text-anchor="middle" font-weight="600">lost</text>
<rect x="558" y="346" width="80" height="44" rx="8" fill="#F0B323" stroke="#F0B323" stroke-width="2" fill-opacity="0.15"/>
<text x="598" y="374" font-size="15" fill="#E4EDF5" text-anchor="middle" font-weight="600">V5</text>
<text x="170" y="442" font-size="14" fill="#A9BDCF" text-anchor="end" font-weight="normal">you hear</text>
<rect x="190" y="412" width="80" height="44" rx="8" fill="#F0B323" stroke="#F0B323" stroke-width="2" fill-opacity="0.15"/>
