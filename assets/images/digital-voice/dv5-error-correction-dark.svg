<text x="553" y="145" font-size="13" fill="#A9BDCF" text-anchor="start" font-weight="normal">your data</text>
<text x="553" y="163" font-size="13" fill="#2FD68A" text-anchor="start" font-weight="normal">+ spare bits calculated from it</text>
<text x="553" y="197" font-size="13" fill="#F06A7B" text-anchor="start" font-weight="normal">noise flips one bit on the way</text>
<text x="553" y="249" font-size="13" fill="#A9BDCF" text-anchor="start" font-weight="normal">the spare bits no longer match, so the</text>
<text x="553" y="267" font-size="13" fill="#A9BDCF" text-anchor="start" font-weight="normal">receiver works out which bit was wrong</text>
<text x="60" y="320" font-size="16" fill="#5AB4EA" text-anchor="start" font-weight="600">2. A whole frame lost: fill the gap with the last good one</text>
<text x="170" y="376" font-size="14" fill="#A9BDCF" text-anchor="end" font-weight="normal">received</text>
