<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Anatomie van een DMR-codeplug: een zone groepeert kanalen; elk kanaal combineert frequenties, color code, tijdslot, een contact en een RX-groepslijst" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
<title>Anatomie van een DMR-codeplug: een zone groepeert kanalen; elk kanaal combineert frequenties, color code, tijdslot, een contact en een RX-groepslijst</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A546B"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6BA8"/></marker></defs>
<rect x="1" y="1" width="998" height="498" rx="16" fill="#FFFFFF" stroke="#C9D5DF" stroke-width="2"/>
<text x="500" y="40" font-size="20" fill="#0B1E30" text-anchor="middle" font-weight="600">Wat zit er in een DMR-codeplug</text>
<text x="500" y="64" font-size="14" fill="#3A546B" text-anchor="middle" font-weight="normal">een zone bevat kanalen; elk kanaal is een klein recept met een paar ingrediënten</text>
<rect x="40" y="95" width="230" height="370" rx="10" fill="#FFFFFF" stroke="#B8791A" stroke-width="2"/>
<text x="155" y="125" font-size="16" fill="#B8791A" text-anchor="middle" font-weight="600">Zone "Thuis"</text>
<rect x="60" y="145" width="190" height="44" rx="8" fill="#F2F6F9" stroke="#1E6BA8" stroke-width="2"/>
<text x="155" y="173" font-size="14" fill="#0B1E30" text-anchor="middle" font-weight="600">Repeater TG 206</text>
<rect x="60" y="205" width="190" height="44" rx="8" fill="#F2F6F9" stroke="#C9D5DF" stroke-width="2"/>
<text x="155" y="233" font-size="14" fill="#0B1E30" text-anchor="middle" font-weight="normal">Repeater TG 9990</text>
<rect x="60" y="265" width="190" height="44" rx="8" fill="#F2F6F9" stroke="#C9D5DF" stroke-width="2"/>
<text x="155" y="293" font-size="14" fill="#0B1E30" text-anchor="middle" font-weight="normal">Hotspot</text>
<rect x="60" y="325" width="190" height="44" rx="8" fill="#F2F6F9" stroke="#C9D5DF" stroke-width="2"/>
<text x="155" y="353" font-size="14" fill="#0B1E30" text-anchor="middle" font-weight="normal">Analoog FM 2 m</text>
<rect x="60" y="385" width="190" height="44" rx="8" fill="#F2F6F9" stroke="#C9D5DF" stroke-width="2"/>
<text x="155" y="413" font-size="14" fill="#0B1E30" text-anchor="middle" font-weight="normal">...</text>
<line x1="252" y1="167" x2="318" y2="167" stroke="#1E6BA8" stroke-width="2" marker-end="url(#arB)"/>
<rect x="320" y="95" width="330" height="370" rx="10" fill="#F2F6F9" stroke="#1E6BA8" stroke-width="2"/>
<text x="485" y="125" font-size="16" fill="#1E6BA8" text-anchor="middle" font-weight="600">Kanaal "Repeater TG 206"</text>
<text x="340" y="164" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="600">Ontvangstfrequentie</text>
<text x="340" y="183" font-size="13" fill="#3A546B" text-anchor="start" font-weight="normal">waar je luistert</text>
<text x="340" y="214" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="600">Zendfrequentie</text>
<text x="340" y="233" font-size="13" fill="#3A546B" text-anchor="start" font-weight="normal">waar je zendt (repeatershift)</text>
<text x="340" y="264" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="600">Color code</text>
<text x="340" y="283" font-size="13" fill="#3A546B" text-anchor="start" font-weight="normal">welke repeater, zoals een CTCSS-toon</text>
<text x="340" y="314" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="600">Tijdslot</text>
<text x="340" y="333" font-size="13" fill="#3A546B" text-anchor="start" font-weight="normal">TS1 of TS2</text>
<text x="340" y="364" font-size="14" fill="#0E8A50" text-anchor="start" font-weight="600">Contact</text>
<text x="340" y="383" font-size="13" fill="#3A546B" text-anchor="start" font-weight="normal">de talkgroup waarnaar je zendt</text>
<text x="340" y="414" font-size="14" fill="#B8791A" text-anchor="start" font-weight="600">RX-groepslijst</text>
<text x="340" y="433" font-size="13" fill="#3A546B" text-anchor="start" font-weight="normal">de talkgroups die je hoort</text>
<rect x="720" y="95" width="240" height="170" rx="10" fill="#FFFFFF" stroke="#0E8A50" stroke-width="2"/>
<text x="840" y="125" font-size="16" fill="#0E8A50" text-anchor="middle" font-weight="600">Contacten</text>
<text x="740" y="155" font-size="13" fill="#0B1E30" text-anchor="start" font-weight="normal">TG 206 België</text>
<text x="740" y="181" font-size="13" fill="#0B1E30" text-anchor="start" font-weight="normal">TG 9990 Parrot (echotest)</text>
<text x="740" y="207" font-size="13" fill="#0B1E30" text-anchor="start" font-weight="normal">TG 91 Wereldwijd</text>
<text x="740" y="233" font-size="13" fill="#0B1E30" text-anchor="start" font-weight="normal">een privé-oproep naar één ID</text>
<rect x="720" y="290" width="240" height="175" rx="10" fill="#FFFFFF" stroke="#B8791A" stroke-width="2"/>
<text x="840" y="320" font-size="16" fill="#B8791A" text-anchor="middle" font-weight="600">RX-groepslijst</text>
<text x="740" y="350" font-size="13" fill="#0B1E30" text-anchor="start" font-weight="normal">TG 206 België</text>
<text x="740" y="374" font-size="13" fill="#0B1E30" text-anchor="start" font-weight="normal">TG 9990 Parrot</text>
<text x="740" y="398" font-size="13" fill="#0B1E30" text-anchor="start" font-weight="normal">je lokale talkgroup</text>
<text x="740" y="422" font-size="13" fill="#3A546B" text-anchor="start" font-weight="normal">(talkgroups die niet op de lijst</text>
<text x="740" y="446" font-size="13" fill="#3A546B" text-anchor="start" font-weight="normal">staan, blijven stil)</text>
<line x1="600" y1="360" x2="716" y2="210" stroke="#0E8A50" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="600" y1="410" x2="716" y2="380" stroke="#B8791A" stroke-width="2" stroke-dasharray="5 5"/>
</svg>
