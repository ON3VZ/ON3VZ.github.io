<rect x="150" y="348" width="700" height="58" rx="10" fill="#FFFFFF" stroke="#C9D5DF" stroke-width="2"/>
<text x="500" y="373" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">Het ontvangende toestel doorloopt dezelfde keten achterstevoren:</text>
<text x="500" y="394" font-size="14" fill="#3A546B" text-anchor="middle" font-weight="normal">tonen worden bits, beschadigde bits worden hersteld, de codec bouwt een stem</text>
