<text x="875.0" y="192" font-size="13" fill="#3A546B" text-anchor="middle" font-weight="normal">maakt van bits</text>
<text x="875.0" y="210" font-size="13" fill="#3A546B" text-anchor="middle" font-weight="normal">tonen in de lucht</text>
