<text x="305.0" y="158" font-size="18" fill="#B8791A" text-anchor="middle" font-weight="600">0 1 1 0 1 0</text>
<text x="305.0" y="192" font-size="13" fill="#3A546B" text-anchor="middle" font-weight="normal">perst ze samen tot</text>
<text x="305.0" y="210" font-size="13" fill="#3A546B" text-anchor="middle" font-weight="normal">een straaltje bits</text>
