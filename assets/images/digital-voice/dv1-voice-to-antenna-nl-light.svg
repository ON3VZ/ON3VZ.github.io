<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Van je stem naar de antenne en terug: microfoon, codec, foutbescherming, pakketten, modulator" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
