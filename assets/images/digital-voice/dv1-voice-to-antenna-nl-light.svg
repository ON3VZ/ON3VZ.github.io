<text x="495.0" y="192" font-size="13" fill="#3A546B" text-anchor="middle" font-weight="normal">voegt reservebits toe</text>
<text x="495.0" y="210" font-size="13" fill="#3A546B" text-anchor="middle" font-weight="normal">om fouten te herstellen</text>
