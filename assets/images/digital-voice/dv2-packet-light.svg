<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="A digital voice transmission: a header with sync, flags, callsign and checksum, then voice and data blocks taking turns, then an end marker" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
<title>A digital voice transmission: a header with sync, flags, callsign and checksum, then voice and data blocks taking turns, then an end marker</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3A546B"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E6BA8"/></marker></defs>
<rect x="1" y="1" width="998" height="358" rx="16" fill="#FFFFFF" stroke="#C9D5DF" stroke-width="2"/>
<text x="500" y="42" font-size="20" fill="#0B1E30" text-anchor="middle" font-weight="600">What a digital voice over actually looks like</text>
<text x="500" y="66" font-size="14" fill="#3A546B" text-anchor="middle" font-weight="normal">one long train of bits, chopped into blocks that always come in the same order</text>
<rect x="60" y="120" width="164" height="64" rx="8" fill="#C8384B" fill-opacity="0.18" stroke="#C8384B" stroke-width="2"/>
<text x="142.0" y="158" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">Header</text>
<rect x="230" y="120" width="86" height="64" rx="8" fill="#B8791A" fill-opacity="0.18" stroke="#B8791A" stroke-width="2"/>
<text x="273.0" y="158" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">Voice</text>
<rect x="322" y="120" width="44" height="64" rx="8" fill="#0E8A50" fill-opacity="0.18" stroke="#0E8A50" stroke-width="2"/>
<text x="344.0" y="158" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">Data</text>
<rect x="372" y="120" width="86" height="64" rx="8" fill="#B8791A" fill-opacity="0.18" stroke="#B8791A" stroke-width="2"/>
<text x="415.0" y="158" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">Voice</text>
<rect x="464" y="120" width="44" height="64" rx="8" fill="#0E8A50" fill-opacity="0.18" stroke="#0E8A50" stroke-width="2"/>
<text x="486.0" y="158" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">Data</text>
<rect x="514" y="120" width="86" height="64" rx="8" fill="#B8791A" fill-opacity="0.18" stroke="#B8791A" stroke-width="2"/>
<text x="557.0" y="158" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">Voice</text>
<rect x="606" y="120" width="44" height="64" rx="8" fill="#0E8A50" fill-opacity="0.18" stroke="#0E8A50" stroke-width="2"/>
<text x="628.0" y="158" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">Data</text>
<rect x="656" y="120" width="54" height="64" rx="8" fill="#F2F6F9" fill-opacity="1" stroke="#C9D5DF" stroke-width="2"/>
<text x="683.0" y="158" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">...</text>
<rect x="716" y="120" width="86" height="64" rx="8" fill="#B8791A" fill-opacity="0.18" stroke="#B8791A" stroke-width="2"/>
<text x="759.0" y="158" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">Voice</text>
<rect x="808" y="120" width="64" height="64" rx="8" fill="#C8384B" fill-opacity="0.18" stroke="#C8384B" stroke-width="2"/>
<text x="840.0" y="158" font-size="15" fill="#0B1E30" text-anchor="middle" font-weight="600">End</text>
<line x1="60" y1="210" x2="930" y2="210" stroke="#3A546B" stroke-width="2" marker-end="url(#ar)"/>
<text x="940" y="215" font-size="13" fill="#3A546B" text-anchor="start" font-weight="normal">time</text>
<path d="M60,112 L60,102 L224,102 L224,112" stroke="#C8384B" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="78" cy="247" r="4" fill="#C8384B"/>
<text x="92" y="252" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="normal">sync: "wake up, a transmission starts"</text>
<circle cx="78" cy="271" r="4" fill="#C8384B"/>
<text x="92" y="276" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="normal">flags: what kind of traffic follows</text>
<circle cx="78" cy="295" r="4" fill="#C8384B"/>
<text x="92" y="300" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="normal">who: the callsign or DMR ID</text>
<circle cx="78" cy="319" r="4" fill="#C8384B"/>
<text x="92" y="324" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="normal">checksum: did the header arrive intact?</text>
<circle cx="560" cy="247" r="4" fill="#B8791A"/>
<text x="574" y="252" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="normal">voice: a few tens of milliseconds of speech</text>
<circle cx="560" cy="271" r="4" fill="#0E8A50"/>
<text x="574" y="276" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="normal">data: sync, callsign again, GPS, short text</text>
<circle cx="560" cy="295" r="4" fill="#C8384B"/>
<text x="574" y="300" font-size="14" fill="#0B1E30" text-anchor="start" font-weight="normal">end: the over is finished, release the channel</text>
</svg>
