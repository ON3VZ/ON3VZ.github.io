<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="How digital voice travels beyond one repeater: radio to hotspot or repeater, over the internet to a reflector, talkgroup or room, and out again elsewhere" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
<title>How digital voice travels beyond one repeater: radio to hotspot or repeater, over the internet to a reflector, talkgroup or room, and out again elsewhere</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A9BDCF"/></marker><marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5AB4EA"/></marker></defs>
<rect x="1" y="1" width="998" height="418" rx="16" fill="#142334" stroke="#2E4560" stroke-width="2"/>
<text x="500" y="40" font-size="20" fill="#E4EDF5" text-anchor="middle" font-weight="600">From your handheld to the other side of the world</text>
<rect x="40" y="90" width="150" height="70" rx="10" fill="#1A2C40" stroke="#F0B323" stroke-width="2"/>
<text x="115.0" y="120" font-size="15" fill="#E4EDF5" text-anchor="middle" font-weight="600">Your radio</text>
<text x="115.0" y="142" font-size="12" fill="#A9BDCF" text-anchor="middle" font-weight="normal">DMR, D-STAR, Fusion</text>
<rect x="40" y="260" width="150" height="70" rx="10" fill="#1A2C40" stroke="#F0B323" stroke-width="2"/>
<text x="115.0" y="290" font-size="15" fill="#E4EDF5" text-anchor="middle" font-weight="600">Your radio</text>
<text x="115.0" y="312" font-size="12" fill="#A9BDCF" text-anchor="middle" font-weight="normal">at home</text>
<rect x="260" y="90" width="160" height="70" rx="10" fill="#1A2C40" stroke="#5AB4EA" stroke-width="2"/>
<text x="340.0" y="120" font-size="15" fill="#E4EDF5" text-anchor="middle" font-weight="600">Repeater</text>
<text x="340.0" y="142" font-size="12" fill="#A9BDCF" text-anchor="middle" font-weight="normal">on a tower nearby</text>
<rect x="260" y="260" width="160" height="70" rx="10" fill="#1A2C40" stroke="#5AB4EA" stroke-width="2"/>
<text x="340.0" y="290" font-size="15" fill="#E4EDF5" text-anchor="middle" font-weight="600">Hotspot</text>
<text x="340.0" y="312" font-size="12" fill="#A9BDCF" text-anchor="middle" font-weight="normal">a tiny box at home</text>
<path d="M480,240 C450,240 445,200 475,193 C470,160 515,150 530,170 C545,140 600,145 600,175 C630,170 645,205 620,220 C640,245 600,262 585,250 C570,272 520,270 510,252 C495,262 470,258 480,240 Z" fill="#1A2C40" stroke="#2E4560" stroke-width="2"/>
<text x="545" y="212" font-size="15" fill="#E4EDF5" text-anchor="middle" font-weight="600">internet</text>
<rect x="680" y="175" width="170" height="70" rx="10" fill="#1A2C40" stroke="#2FD68A" stroke-width="2"/>
<text x="765.0" y="205" font-size="15" fill="#E4EDF5" text-anchor="middle" font-weight="600">Reflector, room</text>
<text x="765.0" y="227" font-size="12" fill="#A9BDCF" text-anchor="middle" font-weight="normal">or talkgroup</text>
<rect x="800" y="60" width="160" height="70" rx="10" fill="#1A2C40" stroke="#5AB4EA" stroke-width="2"/>
<text x="880.0" y="90" font-size="15" fill="#E4EDF5" text-anchor="middle" font-weight="600">Other repeaters</text>
<text x="880.0" y="112" font-size="12" fill="#A9BDCF" text-anchor="middle" font-weight="normal">and hotspots</text>
<rect x="800" y="300" width="160" height="70" rx="10" fill="#1A2C40" stroke="#F0B323" stroke-width="2"/>
<text x="880.0" y="330" font-size="15" fill="#E4EDF5" text-anchor="middle" font-weight="600">Other radios</text>
<text x="880.0" y="352" font-size="12" fill="#A9BDCF" text-anchor="middle" font-weight="normal">anywhere</text>
<line x1="190" y1="125" x2="255" y2="125" stroke="#A9BDCF" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5 5"/>
<text x="222" y="115" font-size="12" fill="#A9BDCF" text-anchor="middle" font-weight="normal">RF</text>
<line x1="190" y1="295" x2="255" y2="295" stroke="#A9BDCF" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5 5"/>
<text x="222" y="285" font-size="12" fill="#A9BDCF" text-anchor="middle" font-weight="normal">RF</text>
<line x1="420" y1="140" x2="478" y2="185" stroke="#A9BDCF" stroke-width="2" marker-end="url(#ar)"/>
<line x1="420" y1="280" x2="478" y2="240" stroke="#A9BDCF" stroke-width="2" marker-end="url(#ar)"/>
<line x1="625" y1="210" x2="676" y2="210" stroke="#A9BDCF" stroke-width="2" marker-end="url(#ar)"/>
<line x1="820" y1="172" x2="860" y2="133" stroke="#A9BDCF" stroke-width="2" marker-end="url(#ar)"/>
<line x1="820" y1="248" x2="860" y2="297" stroke="#A9BDCF" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="360" width="380" height="40" rx="8" fill="#142334" stroke="#2E4560" stroke-width="2"/>
<text x="230" y="385" font-size="13" fill="#A9BDCF" text-anchor="middle" font-weight="normal">or simply radio to radio, no network at all</text>
</svg>
