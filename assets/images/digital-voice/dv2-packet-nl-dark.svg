<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-label="Een digitale spraakuitzending: een header met sync, vlaggen, roepnaam en checksum, dan spraak- en datablokjes om beurten, dan een eindmarkering" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif">
