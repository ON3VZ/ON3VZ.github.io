<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="'Share Tech Mono','JetBrains Mono',monospace">
  <rect width="980" height="440" rx="10" fill="#0b1220"/>
  <text x="490" y="34" text-anchor="middle" fill="#e8f0f2" font-size="19">The 49:1 UNUN: impedance matchmaker for the EFHW</text>

  <!-- transceiver -->
  <rect x="40" y="150" width="150" height="90" rx="8" fill="#0e1730" stroke="#1c2a40" stroke-width="2"/>
  <text x="115" y="188" text-anchor="middle" fill="#e8f0f2" font-size="15">Transceiver</text>
  <text x="115" y="212" text-anchor="middle" fill="#38e1ff" font-size="14">wants 50 &#937;</text>

  <!-- coax -->
  <line x1="190" y1="195" x2="330" y2="195" stroke="#38e1ff" stroke-width="4"/>
  <text x="260" y="180" text-anchor="middle" fill="#8fa3b8" font-size="13">50 &#937; coax</text>

  <!-- unun box -->
  <rect x="330" y="110" width="270" height="180" rx="10" fill="#0e1730" stroke="#00ff9d" stroke-width="2"/>
  <text x="465" y="140" text-anchor="middle" fill="#00ff9d" font-size="16">49:1 UNUN</text>
  <text x="465" y="160" text-anchor="middle" fill="#8fa3b8" font-size="12">on a ferrite toroid (here: FT240-43)</text>

  <!-- toroid -->
  <circle cx="415" cy="222" r="38" fill="none" stroke="#5a6b80" stroke-width="14"/>
  <path d="M 385 200 q 8 -14 22 -16 M 380 226 q -6 -12 2 -24 M 390 248 q -12 -8 -12 -20 M 412 258 q -14 0 -22 -8" fill="none" stroke="#ffbf47" stroke-width="3"/>
  <path d="M 448 200 q -8 -14 -20 -15 M 452 228 q 6 -14 -2 -26 M 442 250 q 12 -10 11 -22" fill="none" stroke="#ff8f5c" stroke-width="3"/>

  <!-- ratio text -->
  <text x="530" y="205" text-anchor="middle" fill="#e8f0f2" font-size="14">turns 1 : 7</text>
  <text x="530" y="227" text-anchor="middle" fill="#e8f0f2" font-size="14">impedance 1 : 49</text>
  <text x="530" y="252" text-anchor="middle" fill="#ffbf47" font-size="13">(7 &#215; 7 = 49)</text>

  <!-- output wire -->
  <line x1="600" y1="195" x2="700" y2="195" stroke="#00ff9d" stroke-width="3"/>
  <path d="M 700 195 q 40 -60 80 -90 q 50 -38 130 -50" fill="none" stroke="#00ff9d" stroke-width="3"/>
  <text x="810" y="90" text-anchor="middle" fill="#00ff9d" font-size="14">end-fed half-wave wire</text>
  <text x="810" y="110" text-anchor="middle" fill="#8fa3b8" font-size="13">feedpoint &#8776; 2000 to 3000 &#937;</text>

  <!-- math strip -->
  <rect x="330" y="330" width="480" height="60" rx="8" fill="#0e1730" stroke="#1c2a40" stroke-width="2"/>
  <text x="570" y="356" text-anchor="middle" fill="#e8f0f2" font-size="15">50 &#937; &#215; 49 = 2450 &#937;</text>
  <text x="570" y="378" text-anchor="middle" fill="#8fa3b8" font-size="13">the high feedpoint impedance is transformed down to what the rig expects</text>

  <!-- ground -->
  <line x1="465" y1="290" x2="465" y2="320" stroke="#8fa3b8" stroke-width="2"/>
  <line x1="447" y1="320" x2="483" y2="320" stroke="#8fa3b8" stroke-width="2"/>
  <line x1="453" y1="327" x2="477" y2="327" stroke="#8fa3b8" stroke-width="2"/>
  <line x1="459" y1="334" x2="471" y2="334" stroke="#8fa3b8" stroke-width="2"/>
  <text x="428" y="316" text-anchor="end" fill="#8fa3b8" font-size="12">counterpoise / coax shield</text>
</svg>
