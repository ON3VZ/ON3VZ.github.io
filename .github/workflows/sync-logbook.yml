name: Sync QRZ Logbook

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-logbook:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch QRZ logbook (ADIF)
        env:
          QRZ_API_KEY: ${{ secrets.QRZ_API_KEY }}
        run: curl -s -X POST --data "KEY=${QRZ_API_KEY}&ACTION=FETCH&OPTION=ADIF" "https://logbook.qrz.com/api" -o assets/data/logbook.adi

      - name: Verify and show result
        run: |
          echo "File size: $(wc -c < assets/data/logbook.adi) bytes"
          cat assets/data/logbook.adi

      - name: Commit updated logbook
        run: |
          git config user.email "on3vz@uba.be"
          git config user.name "ON3VZ"
          git add assets/data/logbook.adi
          git diff --staged --quiet || git commit -m "chore: sync QRZ logbook [skip ci]" && git push
