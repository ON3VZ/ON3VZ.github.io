name: Sync QRZ Logbook

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-logbook:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch QRZ logbook (ADIF)
        env:
          QRZ_API_KEY: ${{ secrets.QRZ_API_KEY }}
        run: |
          curl -s \
            "https://logbook.qrz.com/api?key=${QRZ_API_KEY}&action=FETCH&option=ADIF" \
            -o assets/data/logbook.adi

          if [ ! -s assets/data/logbook.adi ]; then
            echo "ERROR: Downloaded ADIF file is empty."
            exit 1
          fi

          QSOCOUNT=$(grep -ci "<EOR>" assets/data/logbook.adi || echo 0)
          echo "QSOs found: ${QSOCOUNT}"

      - name: Commit updated logbook
        run: |
          git config user.email "on3vz@uba.be"
          git config user.name  "ON3VZ"
          git add assets/data/logbook.adi
          if git diff --staged --quiet; then
            echo "No changes — skipping commit."
          else
            QSOCOUNT=$(grep -ci "<EOR>" assets/data/logbook.adi || echo 0)
            git commit -m "chore: sync QRZ logbook (${QSOCOUNT} QSOs) [skip ci]"
            git push
          fi
