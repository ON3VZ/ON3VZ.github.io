name: Update Logbook Manifest

on:
  push:
    paths:
      - 'assets/data/**'
  workflow_dispatch:

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate manifest.json
        run: |
          cd assets/data
          FILES=()
          for f in *; do
            [ "$f" = "manifest.json" ] && continue
            [ "$f" = ".gitkeep" ] && continue
            if [[ "$f" == *.adi ]] || grep -qi "<eor>" "$f" 2>/dev/null; then
              FILES+=("\"$f\"")
            fi
          done
          JSON_FILES=$(IFS=','; echo "${FILES[*]}")
          DATE=$(date +%Y-%m-%d)
          echo "{\"files\":[${JSON_FILES}],\"updated\":\"${DATE}\"}" > manifest.json
          echo "Manifest updated:"
          cat manifest.json

      - name: Commit manifest
        run: |
          git config user.email "on3vz@uba.be"
          git config user.name "ON3VZ"
          git add assets/data/manifest.json
          git diff --staged --quiet || (git commit -m "chore: update logbook manifest [skip ci]" && git push)
