name: Sync QRZ Logbook

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-logbook:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch QRZ logbook (ADIF)
        env:
          QRZ_API_KEY: ${{ secrets.QRZ_API_KEY }}
        run: |
          curl -s -X POST \
            --data "KEY=${QRZ_API_KEY}&ACTION=FETCH&OPTION=ADIF" \
            "https://logbook.qrz.com/api" \
            -o assets/data/logbook.adi

          if [ ! -s assets/data/logbook.adi ]; then
            echo "ERROR: Downloaded ADIF file is empty."
            exit 1
          fi

          if grep -q "STATUS=FAIL" asse
