[workspace]
resolver = "2"
members = ["crates/cwld-types", "crates/cwld-radio", "crates/cwld-core", "crates/cwld-dsp", "crates/cwld-decoder", "crates/cwld-audio", "crates/cwld-log", "crates/cwld-lookup", "crates/cwld-cluster", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/on3vz/CWLD_DECODE"
authors = ["Kristof (ON3VZ)"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
